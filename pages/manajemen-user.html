<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manajemen User — BANITAMHID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body>
<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f0ea">
  <div style="text-align:center;color:#8a8a8a"><div style="font-size:32px">🌳</div><div>Memuat...</div></div>
</div>

<!-- Modal Tambah / Edit User -->
<div class="modal-backdrop" id="modalUser">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h3 id="modalUserTitle">Tambah User</h3>
      <button class="btn-icon" onclick="UI.closeModal('modalUser')">✕</button>
    </div>
    <div class="modal-body">
      <div id="userAlert"></div>
      <div class="form-grid col-1">
        <div class="form-group">
          <label class="form-label">Nama Lengkap <span class="required">*</span></label>
          <input type="text" class="form-control" id="u-nama" placeholder="Nama lengkap"/>
        </div>
        <div class="form-group" id="wrapUsername">
          <label class="form-label">Username <span class="required">*</span></label>
          <div style="position:relative">
            <input type="text" class="form-control" id="u-username"
              placeholder="contoh: ahmadfarid"
              autocapitalize="none" autocorrect="off" spellcheck="false"
              oninput="validateUsernameInput(this)" style="padding-right:36px"/>
            <span id="usernameStatus" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px"></span>
          </div>
          <div class="form-hint">Huruf kecil (a–z), angka (0–9), underscore (_). Min. 3 karakter. Digunakan untuk login.</div>
        </div>
        <div class="form-group" id="wrapEmail">
          <label class="form-label">Email <span style="font-size:11px;color:var(--text-light)">(opsional)</span></label>
          <input type="email" class="form-control" id="u-email" placeholder="nama@email.com"/>
          <div class="form-hint">Opsional. Jika diisi, dapat digunakan untuk keperluan reset password oleh Admin.</div>
        </div>
        <div class="form-group" id="wrapPassword">
          <label class="form-label">Password <span class="required">*</span></label>
          <input type="password" class="form-control" id="u-password" placeholder="Minimal 8 karakter"/>
          <div class="form-hint" id="passHint">Minimal 8 karakter.</div>
        </div>
        <div class="form-group">
          <label class="form-label">Role / Hak Akses</label>
          <select class="form-control" id="u-role">
            <option value="member">Member — Hanya lihat data</option>
            <option value="admin_keluarga">Admin Keluarga — Tambah &amp; edit data</option>
            <option value="super_admin">Super Admin — Akses penuh</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-control" id="u-aktif">
            <option value="true">Aktif</option>
            <option value="false">Nonaktif</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="UI.closeModal('modalUser')">Batal</button>
      <button class="btn btn-primary" id="btnSimpanUser" onclick="simpanUser()">
        <span class="btn-text">💾 Simpan</span>
        <div class="spinner"></div>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/ui.js"></script>
<script>
let editingUserId = null;

(async () => {
  const session = await BANITAMHID.Auth.requireAuth();
  if (!session) return;
  const user    = await BANITAMHID.Auth.getUser();
  const profile = await BANITAMHID.UserProfile.getProfile(user.id);

  // Hanya super admin
  if (profile?.role !== 'super_admin') {
    window.location.href = 'dashboard.html';
    return;
  }

  document.getElementById('root').outerHTML = `
  <div class="app-shell">
    ${UI._sidebar('users', profile)}
    <div class="main-wrap">
      ${UI._topbar('Manajemen User', profile)}
      <div class="page-content">

        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px">
          <div class="search-wrap">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input class="search-input" placeholder="Cari nama atau email..." oninput="filterUsers(this.value)"/>
          </div>
          <select class="form-control" style="width:auto;padding:9px 14px" onchange="filterRole(this.value)">
            <option value="">Semua Role</option>
            <option value="super_admin">Super Admin</option>
            <option value="admin_keluarga">Admin Keluarga</option>
            <option value="member">Member</option>
          </select>
          <div style="flex:1"></div>
          <button class="btn btn-primary" onclick="openUserForm()">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Tambah User
          </button>
        </div>

        <!-- Panduan role -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px">
          ${roleCard('🛡️', 'Super Admin', 'Akses penuh: kelola semua data, user, dan backup database.', '#fff8e1', '#9a6500')}
          ${roleCard('👨‍💼', 'Admin Keluarga', 'Tambah, edit, hapus data anggota dan upload foto.', 'var(--green-pale)', 'var(--green-mid)')}
          ${roleCard('👁️', 'Member', 'Hanya bisa melihat dan menjelajahi data silsilah.', '#e8f0fe', '#1a56b0')}
        </div>

        <div class="card">
          <div class="card-header">
            <span>👥</span>
            <h2>Daftar Pengguna</h2>
            <span id="userCount" style="font-size:12.5px;color:var(--text-light)">—</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Pengguna</th><th>Username</th><th>Role</th><th>Status</th><th>Terdaftar</th><th style="text-align:center">Aksi</th></tr>
              </thead>
              <tbody id="tbodyUsers">
                ${UI.skeletonRows(6,5)}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Audit log -->
        <div class="card" style="margin-top:20px">
          <div class="card-header"><span>📋</span><h2>Log Aktivitas Terbaru</h2></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Tabel</th></tr></thead>
              <tbody id="tbodyAudit">${UI.skeletonRows(4,6)}</tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="sidebar-overlay" onclick="UI.closeSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>
  `;

  UI._bindEvents(profile);
  loadUsers();
  loadAudit();
})();

let allUsers = [];
let filterSearchVal = '';
let filterRoleVal   = '';

function roleCard(icon, title, desc, bg, color) {
  return `<div style="padding:16px;background:${bg};border-radius:10px;border:1px solid var(--border)">
    <div style="font-size:22px;margin-bottom:8px">${icon}</div>
    <div style="font-size:13px;font-weight:600;color:${color};margin-bottom:4px">${title}</div>
    <div style="font-size:12px;color:var(--text-mid);line-height:1.6">${desc}</div>
  </div>`;
}

async function loadUsers() {
  try {
    const { data, error } = await BANITAMHID.db
      .from('user_profiles')
      .select('*')
      .order('created_at');
    if (error) throw error;
    allUsers = data || [];
    document.getElementById('userCount').textContent = `${allUsers.length} pengguna`;
    renderUsers(allUsers);
  } catch (err) {
    BANITAMHID.Toast.error('Gagal memuat user: ' + err.message);
  }
}

function renderUsers(data) {
  const roleLabel = { super_admin:'Super Admin', admin_keluarga:'Admin Keluarga', member:'Member' };
  const roleBadge = { super_admin:'badge-gold', admin_keluarga:'badge-green', member:'badge-blue' };
  const tbody = document.getElementById('tbodyUsers');

  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">Tidak ada pengguna</div></td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(u => `
    <tr>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="avatar">${(u.nama_lengkap||'?')[0].toUpperCase()}</div>
          <div style="font-weight:500;font-size:13.5px">${u.nama_lengkap}</div>
        </div>
      </td>
      <td style="font-size:13px;color:var(--text-mid)">
        ${u.username
          ? `<span style="font-family:monospace;background:var(--cream);padding:2px 8px;border-radius:4px;font-size:12.5px">@${u.username}</span>`
          : `<span style="color:#ccc;font-size:12px;font-style:italic">belum diset</span>`}
      </td>
      <td><span class="badge ${roleBadge[u.role]||'badge-gray'}">${roleLabel[u.role]||u.role}</span></td>
      <td>
        <span class="badge ${u.aktif?'badge-green':'badge-red'}">${u.aktif?'Aktif':'Nonaktif'}</span>
      </td>
      <td style="font-size:12.5px;color:var(--text-light)">${UI.formatDate(u.created_at)}</td>
      <td>
        <div class="td-actions" style="justify-content:center">
          <button class="btn-icon" title="Edit" onclick="editUser('${u.id}')">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon" title="${u.aktif?'Nonaktifkan':'Aktifkan'}" onclick="toggleAktif('${u.id}',${u.aktif})" style="color:${u.aktif?'var(--error)':'var(--success)'}">
            ${u.aktif ? '🔒' : '🔓'}
          </button>
        </div>
      </td>
    </tr>`).join('');
}

function filterUsers(val) {
  filterSearchVal = val.toLowerCase();
  applyFilter();
}
function filterRole(val) {
  filterRoleVal = val;
  applyFilter();
}
function applyFilter() {
  const filtered = allUsers.filter(u =>
    (!filterSearchVal ||
      u.nama_lengkap?.toLowerCase().includes(filterSearchVal) ||
      u.username?.toLowerCase().includes(filterSearchVal) ||
      u.email?.toLowerCase().includes(filterSearchVal)) &&
    (!filterRoleVal || u.role === filterRoleVal)
  );
  renderUsers(filtered);
}

// ── VALIDASI USERNAME (real-time) ──
let usernameCheckTimer;
function validateUsernameInput(input) {
  const val = input.value.toLowerCase().trim();
  input.value = val.replace(/[^a-z0-9_]/g, '');
  const statusEl = document.getElementById('usernameStatus');

  clearTimeout(usernameCheckTimer);
  if (!val || val.length < 3) {
    statusEl.textContent = val && val.length < 3 ? '⚠️' : '';
    return;
  }
  statusEl.textContent = '⏳';
  usernameCheckTimer = setTimeout(async () => {
    try {
      const available = await BANITAMHID.UserProfile.isUsernameAvailable(val);
      statusEl.textContent = available ? '✅' : '❌';
    } catch (_) { statusEl.textContent = ''; }
  }, 500);
}

// ── FORM USER ──
function openUserForm(data = null) {
  editingUserId = data?.id || null;
  document.getElementById('modalUserTitle').textContent = data ? 'Edit Pengguna' : 'Tambah Pengguna';
  document.getElementById('userAlert').innerHTML = '';
  document.getElementById('u-nama').value     = data?.nama_lengkap || '';
  document.getElementById('u-email').value    = data?.email?.includes('@banitamhid.internal') ? '' : (data?.email || '');
  document.getElementById('u-role').value     = data?.role || 'member';
  document.getElementById('u-aktif').value    = data?.aktif !== false ? 'true' : 'false';
  document.getElementById('u-password').value = '';
  document.getElementById('usernameStatus').textContent = '';

  const usernameInput = document.getElementById('u-username');
  const usernameWrap  = document.getElementById('wrapUsername');

  if (data) {
    // Mode EDIT: tampilkan username tapi readonly
    usernameInput.value    = data.username || '';
    usernameInput.readOnly = true;
    usernameInput.style.background = '#f8f6f2';
    usernameInput.style.color = 'var(--text-mid)';
    document.getElementById('passHint').textContent = 'Biarkan kosong jika tidak ingin mengubah password.';
  } else {
    // Mode TAMBAH: username bisa diisi bebas
    usernameInput.value    = '';
    usernameInput.readOnly = false;
    usernameInput.style.background = '';
    usernameInput.style.color = '';
    document.getElementById('passHint').textContent = 'Minimal 8 karakter.';
  }

  UI.openModal('modalUser');
  if (!data) setTimeout(() => usernameInput.focus(), 100);
}

function editUser(id) {
  const user = allUsers.find(u => u.id === id);
  if (user) openUserForm(user);
}

async function simpanUser() {
  const btn      = document.getElementById('btnSimpanUser');
  const alertEl  = document.getElementById('userAlert');
  const nama     = document.getElementById('u-nama').value.trim();
  const username = document.getElementById('u-username').value.toLowerCase().trim();
  const email    = document.getElementById('u-email').value.trim();
  const pass     = document.getElementById('u-password').value;
  const role     = document.getElementById('u-role').value;
  const aktif    = document.getElementById('u-aktif').value === 'true';

  alertEl.innerHTML = '';

  // Validasi
  if (!nama) {
    alertEl.innerHTML = `<div class="alert alert-error">Nama lengkap wajib diisi.</div>`;
    return;
  }
  if (!editingUserId) {
    if (!username) { alertEl.innerHTML = `<div class="alert alert-error">Username wajib diisi.</div>`; return; }
    if (!/^[a-z0-9_]{3,30}$/.test(username)) {
      alertEl.innerHTML = `<div class="alert alert-error">Username hanya boleh huruf kecil, angka, dan underscore (3–30 karakter).</div>`;
      return;
    }
    if (pass.length < 8) { alertEl.innerHTML = `<div class="alert alert-error">Password minimal 8 karakter.</div>`; return; }
  }

  UI.setLoading(btn, true);

  try {
    if (editingUserId) {
      // ── MODE EDIT ──
      const updatePayload = { nama_lengkap: nama, role, aktif };
      // Update email nyata jika diisi dan bukan internal
      if (email && !email.includes('@banitamhid.internal')) {
        updatePayload.email = email;
      }
      const { error } = await BANITAMHID.db
        .from('user_profiles')
        .update(updatePayload)
        .eq('id', editingUserId);
      if (error) throw error;

      if (pass && pass.length >= 8) {
        const { error: passErr } = await BANITAMHID.db.auth.updateUser({ password: pass });
        if (passErr) {
          alertEl.innerHTML = `<div class="alert alert-warning">
            Profil tersimpan. Password tidak dapat diubah untuk user lain melalui browser —
            gunakan <strong>Supabase Dashboard → Authentication → Users</strong>.
          </div>`;
        }
      }
      BANITAMHID.Toast.success('Data pengguna diperbarui!');
      UI.closeModal('modalUser');
      loadUsers();

    } else {
      // ── MODE TAMBAH ──

      // Cek username unik
      const available = await BANITAMHID.UserProfile.isUsernameAvailable(username);
      if (!available) {
        alertEl.innerHTML = `<div class="alert alert-error">Username <strong>${username}</strong> sudah digunakan. Pilih username lain.</div>`;
        UI.setLoading(btn, false);
        return;
      }

      // Email untuk Supabase Auth: gunakan email nyata jika ada, fallback ke internal
      const authEmail = (email && email.includes('@') && !email.includes('@banitamhid.internal'))
        ? email
        : `${username}@banitamhid.internal`;

      const { data: authData, error: authErr } = await BANITAMHID.db.auth.signUp({
        email: authEmail,
        password: pass,
        options: {
          data: { nama_lengkap: nama, username, role }
        }
      });

      if (authErr) throw authErr;

      // Upsert ke user_profiles dengan username
      const profilePayload = {
        id:           authData.user.id,
        email:        authEmail,
        username:     username,
        nama_lengkap: nama,
        role,
        aktif
      };
      const { error: profErr } = await BANITAMHID.db.from('user_profiles').upsert(profilePayload);
      if (profErr) throw profErr;

      BANITAMHID.Toast.success(`Akun berhasil dibuat! Username: ${username}`);
      UI.closeModal('modalUser');
      loadUsers();
    }
  } catch (err) {
    const msg = err.message || '';
    if (msg.includes('already registered') || msg.includes('already been registered')) {
      alertEl.innerHTML = `<div class="alert alert-error">Email tersebut sudah terdaftar di sistem.</div>`;
    } else if (msg.includes('row-level security') || msg.includes('permission')) {
      alertEl.innerHTML = `<div class="alert alert-warning">
        <strong>Catatan:</strong> Untuk membuat user baru, pastikan RLS policy sudah dikonfigurasi dengan benar,
        atau buat user melalui <strong>Supabase Dashboard → Authentication → Users → Add User</strong>,
        lalu Edit di sini untuk mengatur username dan role.
      </div>`;
    } else {
      alertEl.innerHTML = `<div class="alert alert-error">Gagal: ${msg}</div>`;
    }
  } finally {
    UI.setLoading(btn, false);
  }
}

async function toggleAktif(id, currentStatus) {
  const label = currentStatus ? 'nonaktifkan' : 'aktifkan';
  UI.confirm(`${label.charAt(0).toUpperCase()+label.slice(1)} pengguna ini?`, async () => {
    try {
      await BANITAMHID.db.from('user_profiles').update({ aktif: !currentStatus }).eq('id', id);
      BANITAMHID.Toast.success(`Pengguna berhasil di-${label}.`);
      loadUsers();
    } catch (err) {
      BANITAMHID.Toast.error('Gagal: ' + err.message);
    }
  }, label.charAt(0).toUpperCase()+label.slice(1), currentStatus ? 'danger' : 'primary');
}

// ── AUDIT LOG ──
async function loadAudit() {
  try {
    const data = await BANITAMHID.AuditLog.getAll({ limit: 20 });
    const tbody = document.getElementById('tbodyAudit');
    const aksiColor = { INSERT:'var(--green-mid)', UPDATE:'#9a6500', DELETE:'var(--error)' };

    if (!data?.length) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text-light);font-size:13px">Belum ada log aktivitas</td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(l => `
      <tr>
        <td style="font-size:12px;color:var(--text-light);white-space:nowrap">${UI.formatDate(l.created_at)}</td>
        <td style="font-size:13px">${l.user?.nama_lengkap || l.user?.email || 'System'}</td>
        <td><span style="font-size:12px;font-weight:600;color:${aksiColor[l.aksi]||'var(--text-mid)'}">${l.aksi}</span></td>
        <td style="font-size:12px;color:var(--text-mid)">${l.tabel_nama}</td>
      </tr>`).join('');
  } catch (err) {
    document.getElementById('tbodyAudit').innerHTML = `<tr><td colspan="4" style="color:var(--text-light);font-size:12px;padding:16px">Gagal memuat log: ${err.message}</td></tr>`;
  }
}
</script>
</body>
</html>
