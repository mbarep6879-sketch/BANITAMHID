<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — BANITAMHID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--green-dark:#0f3d2e;--green-mid:#1a5c42;--green-light:#2d8a63;--gold:#c9a84c;--cream:#fdf8f0;--border:#e5e0d8;--error:#c0392b}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--green-dark);font-family:'Plus Jakarta Sans',sans-serif;padding:20px}
    .card{background:var(--cream);border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .logo{text-align:center;margin-bottom:28px}
    .logo-icon{width:60px;height:60px;background:linear-gradient(135deg,var(--gold),#e8c97a);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px}
    .logo-text{font-family:'Amiri',serif;font-size:22px;color:var(--green-dark)}
    h1{font-size:22px;font-weight:600;color:var(--green-dark);margin-bottom:6px}
    p{font-size:13px;color:#8a8a8a;margin-bottom:24px}
    label{display:block;font-size:12.5px;font-weight:500;color:#4a4a4a;margin-bottom:6px}
    .inp{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;background:#fff}
    .inp:focus{border-color:var(--green-light);box-shadow:0 0 0 3px rgba(45,138,99,.1)}
    .form-group{margin-bottom:18px}
    .btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--green-mid),var(--green-light));color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity .2s;margin-top:8px}
    .btn:hover{opacity:.9}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .alert{padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
    .alert-error{background:#fdf0ef;border:1px solid #f5c6c3;color:var(--error)}
    .alert-success{background:#edf7f2;border:1px solid #a7dfbf;color:var(--green-mid)}
    .spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
    .btn.loading .btn-text{display:none}
    .btn.loading .spinner{display:block}
    @keyframes spin{to{transform:rotate(360deg)}}
    .strength-bar{height:4px;border-radius:2px;margin-top:6px;transition:width .3s,background .3s}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🌳</div>
    <div class="logo-text">بني تمهيد</div>
  </div>

  <!-- Panel loading -->
  <div id="loadingPanel" style="text-align:center;padding:20px">
    <div style="font-size:13px;color:#8a8a8a">Memverifikasi tautan...</div>
  </div>

  <!-- Panel form reset -->
  <div id="resetPanel" style="display:none">
    <h1>Buat Password Baru</h1>
    <p>Masukkan password baru untuk akun kamu.</p>

    <div id="alertEl"></div>

    <div class="form-group">
      <label>Password Baru</label>
      <input type="password" class="inp" id="pass1" placeholder="Minimal 8 karakter" oninput="checkStrength(this.value)"/>
      <div style="margin-top:6px">
        <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden">
          <div id="strengthBar" style="height:100%;width:0;transition:width .3s,background .3s;border-radius:2px"></div>
        </div>
        <div id="strengthLabel" style="font-size:11px;color:#8a8a8a;margin-top:4px"></div>
      </div>
    </div>

    <div class="form-group">
      <label>Konfirmasi Password</label>
      <input type="password" class="inp" id="pass2" placeholder="Ulangi password baru"/>
    </div>

    <button class="btn" id="btnReset" onclick="doReset()">
      <span class="btn-text">🔑 Simpan Password Baru</span>
      <div class="spinner"></div>
    </button>
  </div>

  <!-- Panel sukses -->
  <div id="successPanel" style="display:none;text-align:center">
    <div style="font-size:48px;margin-bottom:16px">✅</div>
    <h1 style="font-size:20px;margin-bottom:8px">Password Berhasil Diubah!</h1>
    <p style="margin-bottom:24px">Silakan masuk dengan password baru kamu.</p>
    <button class="btn" onclick="window.location.href='../index.html'">Masuk Sekarang</button>
  </div>

  <!-- Panel error -->
  <div id="errorPanel" style="display:none;text-align:center">
    <div style="font-size:48px;margin-bottom:16px">⚠️</div>
    <h1 style="font-size:18px;color:var(--error);margin-bottom:8px">Tautan Tidak Valid</h1>
    <p style="margin-bottom:24px">Tautan reset password sudah kadaluarsa atau tidak valid.</p>
    <button class="btn" onclick="window.location.href='../index.html'">Kembali ke Login</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script>
const { db } = window.BANITAMHID;

// Cek session dari hash URL (Supabase kirim token via hash)
(async () => {
  const hash = window.location.hash;
  if (hash && hash.includes('access_token')) {
    // Supabase otomatis handle token dari URL hash
    const { data: { session }, error } = await db.auth.getSession();
    if (session) {
      show('resetPanel');
    } else {
      show('errorPanel');
    }
  } else {
    // Coba cek session aktif
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      show('resetPanel');
    } else {
      show('errorPanel');
    }
  }
})();

function show(id) {
  ['loadingPanel','resetPanel','successPanel','errorPanel'].forEach(p => {
    document.getElementById(p).style.display = p === id ? 'block' : 'none';
  });
}

function checkStrength(val) {
  const bar   = document.getElementById('strengthBar');
  const label = document.getElementById('strengthLabel');
  if (!val) { bar.style.width='0'; label.textContent=''; return; }

  let score = 0;
  if (val.length >= 8)  score++;
  if (val.length >= 12) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;

  const levels = [
    { w:'20%', c:'#ef4444', t:'Sangat lemah' },
    { w:'40%', c:'#f97316', t:'Lemah' },
    { w:'60%', c:'#eab308', t:'Sedang' },
    { w:'80%', c:'#22c55e', t:'Kuat' },
    { w:'100%',c:'#16a34a', t:'Sangat kuat' },
  ];
  const lvl = levels[Math.min(score, levels.length) - 1] || levels[0];
  bar.style.width = lvl.w; bar.style.background = lvl.c;
  label.textContent = lvl.t; label.style.color = lvl.c;
}

async function doReset() {
  const btn    = document.getElementById('btnReset');
  const alertEl = document.getElementById('alertEl');
  const pass1  = document.getElementById('pass1').value;
  const pass2  = document.getElementById('pass2').value;

  alertEl.innerHTML = '';
  if (pass1.length < 8) { alertEl.innerHTML = `<div class="alert alert-error">Password minimal 8 karakter.</div>`; return; }
  if (pass1 !== pass2)  { alertEl.innerHTML = `<div class="alert alert-error">Password tidak cocok.</div>`; return; }

  btn.classList.add('loading'); btn.disabled = true;
  try {
    const { error } = await db.auth.updateUser({ password: pass1 });
    if (error) throw error;
    show('successPanel');
  } catch (err) {
    alertEl.innerHTML = `<div class="alert alert-error">Gagal: ${err.message}</div>`;
    btn.classList.remove('loading'); btn.disabled = false;
  }
}
</script>
</body>
</html>
