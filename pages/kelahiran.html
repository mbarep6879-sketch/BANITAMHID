<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kelahiran — BANITAMHID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f0ea">
  <div style="text-align:center;color:#8a8a8a"><div style="font-size:32px">🌳</div><div>Memuat...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/ui.js"></script>
<script>
let currentPage  = 1;
const perPage    = 20;
let totalRows    = 0;
let filterSearch = '';
let filterJK     = '';
let filterTahun  = '';

(async () => {
  const session = await BANITAMHID.Auth.requireAuth();
  if (!session) return;
  const user    = await BANITAMHID.Auth.getUser();
  const profile = await BANITAMHID.UserProfile.getProfile(user.id);

  document.getElementById('root').outerHTML = `
  <div class="app-shell">
    ${UI._sidebar('kelahiran', profile)}
    <div class="main-wrap">
      ${UI._topbar('Data Kelahiran', profile)}
      <div class="page-content">

        <!-- Stat -->
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:22px">
          <div class="stat-card"><div class="stat-icon blue">👶</div><div class="stat-num" id="s-total">—</div><div class="stat-label">Total Kelahiran</div></div>
          <div class="stat-card"><div class="stat-icon blue">👦</div><div class="stat-num" id="s-laki">—</div><div class="stat-label">Laki-laki</div></div>
          <div class="stat-card"><div class="stat-icon purple">👧</div><div class="stat-num" id="s-pr">—</div><div class="stat-label">Perempuan</div></div>
          <div class="stat-card"><div class="stat-icon gold">📅</div><div class="stat-num" id="s-tahun">—</div><div class="stat-label">Tahun Terbanyak</div></div>
        </div>

        <!-- Grafik + Tabel -->
        <div style="display:grid;grid-template-columns:1fr 360px;gap:20px;margin-bottom:20px;align-items:start">

          <!-- Tabel -->
          <div class="card">
            <div class="card-header">
              <span>👶</span><h2>Daftar Kelahiran</h2>
              <span id="totalLabel" style="font-size:12.5px;color:var(--text-light)">—</span>
            </div>

            <!-- Filter -->
            <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:center">
              <div class="search-wrap" style="max-width:240px">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input class="search-input" placeholder="Cari nama..." oninput="onSearch(this.value)"/>
              </div>
              <select class="form-control" style="width:auto;padding:8px 12px" onchange="filterJK=this.value;currentPage=1;loadData()">
                <option value="">Semua JK</option>
                <option value="L">Laki-laki</option>
                <option value="P">Perempuan</option>
              </select>
              <select class="form-control" style="width:auto;padding:8px 12px" id="selTahun" onchange="filterTahun=this.value;currentPage=1;loadData()">
                <option value="">Semua Tahun</option>
              </select>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Nama</th><th>JK</th><th>Tempat Lahir</th><th>Tanggal Lahir</th><th>Usia</th><th>Orang Tua</th></tr>
                </thead>
                <tbody id="tbodyKelahiran">${UI.skeletonRows(6,8)}</tbody>
              </table>
            </div>
            <div class="pagination" id="paginasi"></div>
          </div>

          <!-- Grafik per tahun -->
          <div class="card">
            <div class="card-header"><span>📊</span><h2>Kelahiran per Tahun</h2></div>
            <div class="card-body"><canvas id="chartKelahiran" height="300"></canvas></div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <div class="sidebar-overlay" onclick="UI.closeSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>
  `;

  UI._bindEvents(profile);
  await Promise.all([loadStats(), loadData(), loadChart()]);
})();

async function loadStats() {
  const { data } = await BANITAMHID.db
    .from('anggota_keluarga')
    .select('jenis_kelamin, tanggal_lahir')
    .not('tanggal_lahir', 'is', null);

  const total = data?.length || 0;
  const laki  = data?.filter(a => a.jenis_kelamin === 'L').length || 0;
  const pr    = data?.filter(a => a.jenis_kelamin === 'P').length || 0;

  // Tahun terbanyak
  const byYear = {};
  data?.forEach(a => { const y = new Date(a.tanggal_lahir).getFullYear(); byYear[y] = (byYear[y]||0)+1; });
  const topYear = Object.entries(byYear).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById('s-total').textContent = total;
  document.getElementById('s-laki').textContent  = laki;
  document.getElementById('s-pr').textContent    = pr;
  document.getElementById('s-tahun').textContent = topYear ? topYear[0] : '—';

  // Isi dropdown tahun
  const sel = document.getElementById('selTahun');
  const years = Object.keys(byYear).sort((a,b) => b-a);
  years.forEach(y => { const o = document.createElement('option'); o.value = y; o.textContent = y; sel.appendChild(o); });
}

let searchTimer;
function onSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { filterSearch = val; currentPage = 1; loadData(); }, 400);
}

async function loadData() {
  const tbody = document.getElementById('tbodyKelahiran');
  tbody.innerHTML = UI.skeletonRows(6, 8);
  try {
    let query = BANITAMHID.db
      .from('anggota_keluarga')
      .select('id, nama_lengkap, jenis_kelamin, tempat_lahir, tanggal_lahir, status_hidup, tanggal_wafat, nama_ayah, nama_ibu, foto_profil_url', { count: 'exact' })
      .not('tanggal_lahir', 'is', null)
      .order('tanggal_lahir', { ascending: false })
      .range((currentPage-1)*perPage, currentPage*perPage-1);

    if (filterSearch) query = query.ilike('nama_lengkap', `%${filterSearch}%`);
    if (filterJK)     query = query.eq('jenis_kelamin', filterJK);
    if (filterTahun)  query = query.gte('tanggal_lahir', `${filterTahun}-01-01`).lte('tanggal_lahir', `${filterTahun}-12-31`);

    const { data, count, error } = await query;
    if (error) throw error;
    totalRows = count || 0;
    document.getElementById('totalLabel').textContent = `${totalRows} data`;

    if (!data?.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">👶</div><h3>Tidak ada data kelahiran</h3></div></td></tr>`;
      renderPaginasi(); return;
    }

    tbody.innerHTML = data.map(a => `
      <tr style="cursor:pointer" onclick="window.location.href='anggota.html?id=${a.id}'">
        <td>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="avatar" style="background:${a.jenis_kelamin==='L'?'#e8f0fe':'#f3e8fd'};color:${a.jenis_kelamin==='L'?'#1a56b0':'#7b2fbe'}">
              ${a.foto_profil_url?`<img src="${a.foto_profil_url}" alt=""/>`:(a.jenis_kelamin==='L'?'👦':'👧')}
            </div>
            <span style="font-weight:500">${a.nama_lengkap}</span>
          </div>
        </td>
        <td><span class="badge ${a.jenis_kelamin==='L'?'badge-blue':'badge-purple'}">${a.jenis_kelamin==='L'?'L':'P'}</span></td>
        <td style="color:var(--text-mid);font-size:12.5px">${a.tempat_lahir||'—'}</td>
        <td style="font-size:12.5px;white-space:nowrap">${UI.formatDate(a.tanggal_lahir)}</td>
        <td style="font-size:12.5px;color:var(--text-mid)">${UI.formatAge(a.tanggal_lahir, a.tanggal_wafat)}</td>
        <td style="font-size:12px;color:var(--text-mid)">
          ${[a.nama_ayah?'👨 '+a.nama_ayah:null, a.nama_ibu?'👩 '+a.nama_ibu:null].filter(Boolean).join('<br>')||'—'}
        </td>
      </tr>`).join('');

    renderPaginasi();
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="alert alert-error" style="margin:16px">Gagal memuat: ${err.message}</div></td></tr>`;
  }
}

function renderPaginasi() {
  const totalPages = Math.ceil(totalRows/perPage);
  const el = document.getElementById('paginasi');
  if (totalPages <= 1) { el.innerHTML=''; return; }
  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage<=1?'disabled':''}>‹</button>`;
  for (let i=1; i<=totalPages; i++) {
    if (i===1||i===totalPages||Math.abs(i-currentPage)<=1)
      html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    else if (Math.abs(i-currentPage)===2) html+=`<span style="padding:0 4px;color:var(--text-light)">…</span>`;
  }
  html+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages?'disabled':''}>›</button>`;
  el.innerHTML = html;
}
function goPage(p) { if(p<1||p>Math.ceil(totalRows/perPage))return; currentPage=p; loadData(); window.scrollTo({top:0}); }

async function loadChart() {
  const { data } = await BANITAMHID.db
    .from('anggota_keluarga')
    .select('tanggal_lahir, jenis_kelamin')
    .not('tanggal_lahir','is',null)
    .order('tanggal_lahir');

  const byYear = {};
  data?.forEach(a => {
    const y = new Date(a.tanggal_lahir).getFullYear();
    if (!byYear[y]) byYear[y] = { L:0, P:0 };
    byYear[y][a.jenis_kelamin]++;
  });

  const labels = Object.keys(byYear).sort();
  const laki   = labels.map(y => byYear[y].L);
  const pr     = labels.map(y => byYear[y].P);

  const ctx = document.getElementById('chartKelahiran');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Laki-laki', data: laki, backgroundColor: 'rgba(26,86,176,.7)', borderRadius: 4, order: 1 },
        { label: 'Perempuan', data: pr,   backgroundColor: 'rgba(123,47,190,.7)', borderRadius: 4, order: 1 }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'top', labels: { font: { family: 'Plus Jakarta Sans', size: 11 } } } },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { maxTicksLimit: 10, font: { size: 10 } } },
        y: { stacked: true, grid: { color: 'rgba(0,0,0,.05)' }, ticks: { font: { size: 10 } } }
      }
    }
  });
}
</script>
</body>
</html>
