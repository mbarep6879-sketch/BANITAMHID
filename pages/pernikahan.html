<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pernikahan — BAFITS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body>
<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f0ea">
  <div style="text-align:center;color:#8a8a8a"><div style="font-size:32px">🌳</div><div>Memuat...</div></div>
</div>

<!-- Modal Form Pernikahan -->
<div class="modal-backdrop" id="modalNikah">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <h3 id="modalNikahTitle">Tambah Data Pernikahan</h3>
      <button class="btn-icon" onclick="UI.closeModal('modalNikah')">✕</button>
    </div>
    <div class="modal-body">
      <div id="nikahAlert"></div>
      <div class="form-grid">

        <div class="form-group form-full">
          <label class="form-label">Anggota <span class="required">*</span></label>
          <div style="position:relative">
            <input type="text" class="form-control" id="n-anggota-nama" placeholder="Ketik nama anggota..." autocomplete="off" oninput="acAnggota(this.value)"/>
            <div id="saran-anggota" style="position:absolute;top:100%;left:0;right:0;border:1px solid var(--border);border-radius:8px;background:#fff;display:none;max-height:200px;overflow-y:auto;z-index:50;box-shadow:var(--shadow-md);margin-top:4px"></div>
          </div>
          <input type="hidden" id="n-anggota-id"/>
        </div>

        <div class="form-group">
          <label class="form-label">Nama Pasangan <span class="required">*</span></label>
          <div style="position:relative">
            <input type="text" class="form-control" id="n-pasangan-nama" placeholder="Nama suami/istri..." autocomplete="off" oninput="acPasangan(this.value)"/>
            <div id="saran-pasangan" style="position:absolute;top:100%;left:0;right:0;border:1px solid var(--border);border-radius:8px;background:#fff;display:none;max-height:200px;overflow-y:auto;z-index:50;box-shadow:var(--shadow-md);margin-top:4px"></div>
          </div>
          <input type="hidden" id="n-pasangan-id"/>
          <div class="form-hint">Ketik nama untuk cari dari database, atau tulis manual</div>
        </div>

        <div class="form-group">
          <label class="form-label">Pernikahan ke-</label>
          <input type="number" class="form-control" id="n-urutan" value="1" min="1" max="10"/>
        </div>

        <div class="form-group">
          <label class="form-label">Tanggal Menikah</label>
          <input type="date" class="form-control" id="n-tgl-nikah"/>
        </div>

        <div class="form-group">
          <label class="form-label">Tanggal Berakhir</label>
          <input type="date" class="form-control" id="n-tgl-akhir"/>
          <div class="form-hint">Kosongkan jika masih aktif</div>
        </div>

        <div class="form-group">
          <label class="form-label">Status Pernikahan</label>
          <select class="form-control" id="n-status">
            <option value="aktif">Aktif / Masih menikah</option>
            <option value="cerai">Cerai</option>
            <option value="meninggal">Pasangan meninggal</option>
          </select>
        </div>

        <div class="form-group form-full">
          <label class="form-label">Keterangan (opsional)</label>
          <textarea class="form-control" id="n-ket" rows="2" placeholder="Catatan tambahan..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="UI.closeModal('modalNikah')">Batal</button>
      <button class="btn btn-primary" id="btnSimpanNikah" onclick="simpanNikah()">
        <span class="btn-text">💾 Simpan</span>
        <div class="spinner"></div>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/ui.js"></script>
<script>
let editingNikahId = null;
let isAdmin = false;
let allAnggota = [];
let currentPage = 1;
const perPage = 20;
let totalRows = 0;
let filterSearch = '';
let filterStatus = '';

(async () => {
  const session = await BAFITS.Auth.requireAuth();
  if (!session) return;
  const user    = await BAFITS.Auth.getUser();
  const profile = await BAFITS.UserProfile.getProfile(user.id);
  isAdmin       = await BAFITS.UserProfile.isAdmin();

  document.getElementById('root').outerHTML = `
  <div class="app-shell">
    ${UI._sidebar('pernikahan', profile)}
    <div class="main-wrap">
      ${UI._topbar('Data Pernikahan', profile)}
      <div class="page-content">

        <!-- Stat mini -->
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:22px">
          <div class="stat-card"><div class="stat-icon gold">💍</div><div class="stat-num" id="s-total">—</div><div class="stat-label">Total Pernikahan</div></div>
          <div class="stat-card"><div class="stat-icon green">✅</div><div class="stat-num" id="s-aktif">—</div><div class="stat-label">Masih Menikah</div></div>
          <div class="stat-card"><div class="stat-icon red">💔</div><div class="stat-num" id="s-cerai">—</div><div class="stat-label">Cerai</div></div>
          <div class="stat-card"><div class="stat-icon gray">🌙</div><div class="stat-num" id="s-wafat">—</div><div class="stat-label">Pasangan Wafat</div></div>
        </div>

        <!-- Toolbar -->
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px">
          <div class="search-wrap">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input class="search-input" placeholder="Cari nama anggota atau pasangan..." oninput="onSearch(this.value)"/>
          </div>
          <select class="form-control" style="width:auto;padding:9px 14px" onchange="filterStatus=this.value;currentPage=1;loadData()">
            <option value="">Semua Status</option>
            <option value="aktif">Aktif</option>
            <option value="cerai">Cerai</option>
            <option value="meninggal">Pasangan Wafat</option>
          </select>
          <div style="flex:1"></div>
          <span id="totalLabel" style="font-size:13px;color:var(--text-light)">—</span>
          ${isAdmin ? `<button class="btn btn-primary" onclick="openForm()">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Tambah Pernikahan
          </button>` : ''}
        </div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Anggota</th>
                  <th>Pasangan</th>
                  <th>Ke-</th>
                  <th>Tgl Menikah</th>
                  <th>Tgl Berakhir</th>
                  <th>Status</th>
                  <th style="text-align:center">Aksi</th>
                </tr>
              </thead>
              <tbody id="tbodyNikah">${UI.skeletonRows(7, 8)}</tbody>
            </table>
          </div>
          <div class="pagination" id="paginasi"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="sidebar-overlay" onclick="UI.closeSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>
  `;

  UI._bindEvents(profile);
  loadStats();
  loadData();
  loadAnggotaList();
})();

async function loadStats() {
  const { data } = await BAFITS.db.from('pernikahan_anggota').select('status');
  const total  = data?.length || 0;
  const aktif  = data?.filter(d => d.status === 'aktif').length || 0;
  const cerai  = data?.filter(d => d.status === 'cerai').length || 0;
  const wafat  = data?.filter(d => d.status === 'meninggal').length || 0;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-aktif').textContent = aktif;
  document.getElementById('s-cerai').textContent = cerai;
  document.getElementById('s-wafat').textContent = wafat;
}

async function loadAnggotaList() {
  const { data } = await BAFITS.db.from('anggota_keluarga').select('id, nama_lengkap, jenis_kelamin').order('nama_lengkap');
  allAnggota = data || [];
}

let searchTimer;
function onSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { filterSearch = val; currentPage = 1; loadData(); }, 400);
}

async function loadData() {
  const tbody = document.getElementById('tbodyNikah');
  tbody.innerHTML = UI.skeletonRows(7, 8);
  try {
    let query = BAFITS.db
      .from('pernikahan_anggota')
      .select(`*, anggota:anggota_keluarga!anggota_id(id, nama_lengkap, jenis_kelamin, foto_profil_url)`, { count: 'exact' })
      .order('tanggal_menikah', { ascending: false })
      .range((currentPage - 1) * perPage, currentPage * perPage - 1);

    if (filterStatus) query = query.eq('status', filterStatus);
    if (filterSearch) query = query.or(`nama_pasangan.ilike.%${filterSearch}%`);

    const { data, count, error } = await query;
    if (error) throw error;

    totalRows = count || 0;
    document.getElementById('totalLabel').textContent = `${totalRows} data`;

    if (!data?.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">💍</div><h3>Belum ada data pernikahan</h3></div></td></tr>`;
      renderPaginasi();
      return;
    }

    const statusLabel = { aktif: 'Aktif', cerai: 'Cerai', meninggal: 'Pasangan Wafat' };
    const statusBadge = { aktif: 'badge-green', cerai: 'badge-red', meninggal: 'badge-gray' };

    tbody.innerHTML = data.map(p => `
      <tr>
        <td>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="avatar" style="background:${p.anggota?.jenis_kelamin==='L'?'#e8f0fe':'#f3e8fd'};color:${p.anggota?.jenis_kelamin==='L'?'#1a56b0':'#7b2fbe'}">
              ${p.anggota?.foto_profil_url ? `<img src="${p.anggota.foto_profil_url}" alt=""/>` : UI.inisial(p.anggota?.nama_lengkap||'?')}
            </div>
            <div>
              <div style="font-weight:500;font-size:13.5px">${p.anggota?.nama_lengkap || '—'}</div>
              <div style="font-size:11px;color:var(--text-light)">${p.anggota?.jenis_kelamin === 'L' ? 'Laki-laki' : 'Perempuan'}</div>
            </div>
          </div>
        </td>
        <td style="font-weight:500">💑 ${p.nama_pasangan}</td>
        <td style="text-align:center">
          <span style="font-size:13px;font-weight:600;color:var(--green-dark)">${p.urutan || 1}</span>
        </td>
        <td style="font-size:12.5px;color:var(--text-mid)">${p.tanggal_menikah ? UI.formatDate(p.tanggal_menikah) : '—'}</td>
        <td style="font-size:12.5px;color:var(--text-mid)">${p.tanggal_berakhir ? UI.formatDate(p.tanggal_berakhir) : '—'}</td>
        <td><span class="badge ${statusBadge[p.status] || 'badge-gray'}">${statusLabel[p.status] || p.status}</span></td>
        <td>
          <div class="td-actions" style="justify-content:center">
            ${isAdmin ? `
            <button class="btn-icon" title="Edit" onclick="editNikah('${p.id}')">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="btn-icon" style="color:var(--error)" title="Hapus" onclick="hapusNikah('${p.id}', '${(p.anggota?.nama_lengkap||'').replace(/'/g,"\\'")}')">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M9 6V4h6v2"/></svg>
            </button>` : '<span style="color:var(--text-light);font-size:12px">—</span>'}
          </div>
        </td>
      </tr>`).join('');
    renderPaginasi();
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="alert alert-error" style="margin:16px">Gagal memuat: ${err.message}</div></td></tr>`;
  }
}

function renderPaginasi() {
  const totalPages = Math.ceil(totalRows / perPage);
  const el = document.getElementById('paginasi');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage<=1?'disabled':''}>‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1)
      html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    else if (Math.abs(i - currentPage) === 2)
      html += `<span style="padding:0 4px;color:var(--text-light)">…</span>`;
  }
  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages?'disabled':''}>›</button>`;
  el.innerHTML = html;
}
function goPage(p) { if (p < 1 || p > Math.ceil(totalRows/perPage)) return; currentPage = p; loadData(); window.scrollTo({top:0}); }

// ── AUTOCOMPLETE ──
function acAnggota(val) {
  const saran = document.getElementById('saran-anggota');
  document.getElementById('n-anggota-id').value = '';
  if (val.length < 2) { saran.style.display = 'none'; return; }
  const results = allAnggota.filter(a => a.nama_lengkap.toLowerCase().includes(val.toLowerCase())).slice(0, 8);
  if (!results.length) { saran.style.display = 'none'; return; }
  saran.innerHTML = results.map(a => `
    <div onclick="pilihAnggota('${a.id}','${a.nama_lengkap.replace(/'/g,"\\'")}','${a.jenis_kelamin}')"
      style="padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)"
      onmouseenter="this.style.background='var(--green-pale)'" onmouseleave="this.style.background=''">
      <span style="font-weight:500">${a.nama_lengkap}</span>
      <span style="color:var(--text-light);font-size:11px;margin-left:8px">${a.jenis_kelamin==='L'?'Laki-laki':'Perempuan'}</span>
    </div>`).join('');
  saran.style.display = 'block';
}

function pilihAnggota(id, nama, jk) {
  document.getElementById('n-anggota-nama').value = nama;
  document.getElementById('n-anggota-id').value   = id;
  document.getElementById('saran-anggota').style.display = 'none';
  // Hitung urutan otomatis
  const existing = allAnggota.find(a => a.id === id);
  if (existing) autoUrutan(id);
}

async function autoUrutan(anggotaId) {
  const { count } = await BAFITS.db.from('pernikahan_anggota').select('*',{count:'exact',head:true}).eq('anggota_id', anggotaId);
  document.getElementById('n-urutan').value = (count || 0) + 1;
}

function acPasangan(val) {
  const saran = document.getElementById('saran-pasangan');
  document.getElementById('n-pasangan-id').value = '';
  if (val.length < 2) { saran.style.display = 'none'; return; }
  const results = allAnggota.filter(a => a.nama_lengkap.toLowerCase().includes(val.toLowerCase())).slice(0, 8);
  if (!results.length) { saran.style.display = 'none'; return; }
  saran.innerHTML = results.map(a => `
    <div onclick="pilihPasangan('${a.id}','${a.nama_lengkap.replace(/'/g,"\\'")}' )"
      style="padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)"
      onmouseenter="this.style.background='var(--green-pale)'" onmouseleave="this.style.background=''">
      <span style="font-weight:500">${a.nama_lengkap}</span>
      <span style="color:var(--text-light);font-size:11px;margin-left:8px">${a.jenis_kelamin==='L'?'Laki-laki':'Perempuan'}</span>
    </div>`).join('');
  saran.style.display = 'block';
}
function pilihPasangan(id, nama) {
  document.getElementById('n-pasangan-nama').value = nama;
  document.getElementById('n-pasangan-id').value   = id;
  document.getElementById('saran-pasangan').style.display = 'none';
}
document.addEventListener('click', e => {
  if (!e.target.closest('#n-anggota-nama')) document.getElementById('saran-anggota').style.display = 'none';
  if (!e.target.closest('#n-pasangan-nama')) document.getElementById('saran-pasangan').style.display = 'none';
});

// ── FORM ──
function openForm(data = null) {
  editingNikahId = data?.id || null;
  document.getElementById('modalNikahTitle').textContent = data ? 'Edit Data Pernikahan' : 'Tambah Data Pernikahan';
  document.getElementById('nikahAlert').innerHTML = '';
  document.getElementById('n-anggota-nama').value  = data?.anggota?.nama_lengkap || '';
  document.getElementById('n-anggota-id').value    = data?.anggota_id || '';
  document.getElementById('n-pasangan-nama').value = data?.nama_pasangan || '';
  document.getElementById('n-pasangan-id').value   = data?.pasangan_id || '';
  document.getElementById('n-urutan').value        = data?.urutan || 1;
  document.getElementById('n-tgl-nikah').value     = data?.tanggal_menikah || '';
  document.getElementById('n-tgl-akhir').value     = data?.tanggal_berakhir || '';
  document.getElementById('n-status').value        = data?.status || 'aktif';
  document.getElementById('n-ket').value           = data?.keterangan || '';
  UI.openModal('modalNikah');
}

async function editNikah(id) {
  const { data, error } = await BAFITS.db
    .from('pernikahan_anggota')
    .select(`*, anggota:anggota_keluarga!anggota_id(id, nama_lengkap)`)
    .eq('id', id).single();
  if (!error) openForm(data);
  else BAFITS.Toast.error('Gagal memuat data.');
}

async function simpanNikah() {
  const btn      = document.getElementById('btnSimpanNikah');
  const alertEl  = document.getElementById('nikahAlert');
  const anggotaId  = document.getElementById('n-anggota-id').value;
  const pasangan   = document.getElementById('n-pasangan-nama').value.trim();

  alertEl.innerHTML = '';
  if (!anggotaId)  { alertEl.innerHTML = `<div class="alert alert-error">Pilih anggota terlebih dahulu.</div>`; return; }
  if (!pasangan)   { alertEl.innerHTML = `<div class="alert alert-error">Nama pasangan wajib diisi.</div>`; return; }

  UI.setLoading(btn, true);
  try {
    const payload = {
      anggota_id:       anggotaId,
      pasangan_id:      document.getElementById('n-pasangan-id').value || null,
      nama_pasangan:    pasangan,
      urutan:           parseInt(document.getElementById('n-urutan').value) || 1,
      tanggal_menikah:  document.getElementById('n-tgl-nikah').value || null,
      tanggal_berakhir: document.getElementById('n-tgl-akhir').value || null,
      status:           document.getElementById('n-status').value,
      keterangan:       document.getElementById('n-ket').value.trim() || null,
    };

    if (editingNikahId) {
      const { error } = await BAFITS.db.from('pernikahan_anggota').update(payload).eq('id', editingNikahId);
      if (error) throw error;
    } else {
      const { error } = await BAFITS.db.from('pernikahan_anggota').insert(payload);
      if (error) throw error;
      // Update status_pernikahan di anggota
      await BAFITS.db.from('anggota_keluarga').update({ status_pernikahan: payload.status === 'aktif' ? 'menikah' : payload.status }).eq('id', anggotaId);
    }

    BAFITS.Toast.success(editingNikahId ? 'Data diperbarui!' : 'Pernikahan berhasil dicatat!');
    UI.closeModal('modalNikah');
    loadData(); loadStats();
  } catch (err) {
    alertEl.innerHTML = `<div class="alert alert-error">Gagal menyimpan: ${err.message}</div>`;
  } finally {
    UI.setLoading(btn, false);
  }
}

function hapusNikah(id, nama) {
  UI.confirm(`Hapus data pernikahan milik <strong>${nama}</strong>?`, async () => {
    try {
      await BAFITS.db.from('pernikahan_anggota').delete().eq('id', id);
      BAFITS.Toast.success('Data pernikahan dihapus.');
      loadData(); loadStats();
    } catch (err) { BAFITS.Toast.error('Gagal: ' + err.message); }
  }, 'Hapus');
}
</script>
</body>
</html>
