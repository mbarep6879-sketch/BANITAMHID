<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifikasi — BAFITS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body>
<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f0ea">
  <div style="text-align:center;color:#8a8a8a"><div style="font-size:32px">🌳</div><div>Memuat...</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/ui.js"></script>
<script>
(async () => {
  const session = await BAFITS.Auth.requireAuth();
  if (!session) return;
  const user    = await BAFITS.Auth.getUser();
  const profile = await BAFITS.UserProfile.getProfile(user.id);

  document.getElementById('root').outerHTML = `
  <div class="app-shell">
    ${UI._sidebar('notifikasi', profile)}
    <div class="main-wrap">
      ${UI._topbar('Notifikasi', profile)}
      <div class="page-content">
        <div style="max-width:700px;margin:0 auto">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
            <h2 style="font-size:18px;font-weight:600;color:var(--green-dark);flex:1">🔔 Semua Notifikasi</h2>
            <button class="btn btn-secondary btn-sm" onclick="bacaSemua()">✓ Tandai Semua Dibaca</button>
          </div>
          <div class="card" id="notifContainer">
            <div style="padding:40px;text-align:center;color:var(--text-light)">Memuat...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="sidebar-overlay" onclick="UI.closeSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>
  `;
  UI._bindEvents(profile);
  loadNotif();

  BAFITS.Notifikasi.subscribeRealtime(() => loadNotif());
})();

async function loadNotif() {
  try {
    const data = await BAFITS.Notifikasi.getAll(50);
    const container = document.getElementById('notifContainer');
    const tipeIcon  = { tambah:'➕', kematian:'🌙', pernikahan:'💍', kelahiran:'👶', edit:'✏️' };
    const tipeLabel = { tambah:'Anggota Baru', kematian:'Berita Duka', pernikahan:'Pernikahan', kelahiran:'Kelahiran', edit:'Perubahan Data' };

    if (!data?.length) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔔</div><h3>Tidak ada notifikasi</h3><p>Semua aktivitas keluarga akan muncul di sini</p></div>`;
      return;
    }

    container.innerHTML = data.map(n => `
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:flex-start;background:${!n.dibaca?'#fafdf8':'#fff'};transition:background .2s" id="notif-${n.id}">
        <div style="width:44px;height:44px;border-radius:12px;background:${!n.dibaca?'var(--green-pale)':'#f5f3ef'};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">
          ${tipeIcon[n.tipe]||'📢'}
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:${n.dibaca?'400':'600'};color:var(--text-dark)">${n.judul}</span>
            <span class="badge ${n.tipe==='kematian'?'badge-gray':n.tipe==='pernikahan'?'badge-gold':n.tipe==='kelahiran'?'badge-blue':'badge-green'}" style="font-size:10px">${tipeLabel[n.tipe]||n.tipe}</span>
            ${!n.dibaca ? '<span style="width:8px;height:8px;border-radius:50%;background:var(--green-light);display:inline-block"></span>' : ''}
          </div>
          <p style="font-size:12.5px;color:var(--text-mid);line-height:1.6;margin-bottom:4px">${n.pesan}</p>
          <span style="font-size:11.5px;color:var(--text-light)">${UI.formatDate(n.created_at)}</span>
        </div>
        ${!n.dibaca ? `<button onclick="bacaSatu('${n.id}')" style="font-size:12px;color:var(--green-light);background:none;border:none;cursor:pointer;white-space:nowrap;padding:4px">Tandai dibaca</button>` : ''}
      </div>`).join('');
  } catch (err) {
    BAFITS.Toast.error('Gagal memuat notifikasi: ' + err.message);
  }
}

async function bacaSatu(id) {
  await BAFITS.Notifikasi.markRead(id);
  const el = document.getElementById('notif-' + id);
  if (el) { el.style.background = '#fff'; el.querySelector('button')?.remove(); }
}

async function bacaSemua() {
  await BAFITS.Notifikasi.markAllRead();
  BAFITS.Toast.success('Semua notifikasi ditandai dibaca.');
  loadNotif();
}
</script>
</body>
</html>
