<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — BANITAMHID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- Konten halaman diisi oleh JS setelah auth check -->
<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f0ea">
  <div style="text-align:center;color:#8a8a8a">
    <div style="font-size:32px;margin-bottom:12px">🌳</div>
    <div style="font-size:14px">Memuat dashboard...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/ui.js"></script>
<script>
(async () => {
  const session = await BANITAMHID.Auth.requireAuth();
  if (!session) return;

  const user    = await BANITAMHID.Auth.getUser();
  const profile = await BANITAMHID.UserProfile.getProfile(user.id);

  // ── Render layout shell ──
  document.getElementById('root').outerHTML = `
  <div class="app-shell">
    ${UI._sidebar('dashboard', profile)}
    <div class="main-wrap">
      ${UI._topbar('Dashboard', profile)}
      <div class="page-content">

        <!-- Selamat datang -->
        <div style="margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <div style="flex:1">
            <h1 style="font-family:'Amiri',serif;font-size:26px;color:var(--green-dark);margin-bottom:4px">
              Ahlan wa Sahlan, ${profile?.nama_lengkap?.split(' ')[0] || 'Keluarga'} 👋
            </h1>
            <p style="color:var(--text-light);font-size:13px">
              ${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
            </p>
          </div>
          <a href="anggota.html?action=tambah" class="btn btn-primary">
            ${icons.plus} Tambah Anggota
          </a>
        </div>

        <!-- STAT CARDS -->
        <div class="stats-grid" id="statsGrid">
          ${[1,2,3,4,5,6,7].map(() => `
            <div class="stat-card">
              <div class="skeleton" style="width:40px;height:40px;border-radius:10px"></div>
              <div class="skeleton" style="width:60px;height:32px;border-radius:6px"></div>
              <div class="skeleton" style="width:80px;height:12px;border-radius:4px"></div>
            </div>`).join('')}
        </div>

        <!-- GRAFIK + NOTIF TERBARU -->
        <div style="display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start">

          <!-- Grafik pertumbuhan -->
          <div class="card">
            <div class="card-header">
              <span style="font-size:18px">📈</span>
              <h2>Pertumbuhan Anggota per Tahun</h2>
              <button class="btn btn-secondary btn-sm" onclick="loadChart()">
                ${icons.refresh}
              </button>
            </div>
            <div class="card-body">
              <canvas id="chartPertumbuhan" height="200"></canvas>
            </div>
          </div>

          <!-- Notifikasi terbaru -->
          <div class="card">
            <div class="card-header">
              <span style="font-size:18px">🔔</span>
              <h2>Notifikasi Terbaru</h2>
              <a href="notifikasi.html" style="font-size:12px;color:var(--green-light);text-decoration:none">Lihat semua</a>
            </div>
            <div id="notifList" style="max-height:320px;overflow-y:auto">
              <div style="padding:20px;text-align:center;color:var(--text-light);font-size:13px">
                Memuat...
              </div>
            </div>
          </div>
        </div>

        <!-- ANGGOTA TERBARU -->
        <div class="card" style="margin-top:20px">
          <div class="card-header">
            <span style="font-size:18px">👨‍👩‍👧‍👦</span>
            <h2>Anggota Terbaru</h2>
            <a href="anggota.html" class="btn btn-secondary btn-sm">Lihat Semua</a>
          </div>
          <div class="table-wrap">
            <table id="tblTerbaru">
              <thead>
                <tr>
                  <th>Nama</th>
                  <th>Jenis Kelamin</th>
                  <th>Tempat, Tanggal Lahir</th>
                  <th>Status</th>
                  <th>Ditambahkan</th>
                </tr>
              </thead>
              <tbody id="tbodyTerbaru">
                ${UI.skeletonRows(5, 5)}
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
  <div class="sidebar-overlay" onclick="UI.closeSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>
  `;

  UI._bindEvents(profile);

  // ── Load semua data ──
  await Promise.all([loadStats(), loadNotifikasi(), loadAnggotaTerbaru(), loadChart()]);

  // Realtime notifikasi
  BANITAMHID.Notifikasi.subscribeRealtime(() => {
    loadNotifikasi();
    const dot = document.getElementById('notifDot');
    if (dot) dot.style.display = 'block';
  });

})();

// ── LOAD STATISTIK ──
async function loadStats() {
  try {
    const { data: anggota } = await BANITAMHID.db
      .from('anggota_keluarga')
      .select('jenis_kelamin, status_hidup');

    const total    = anggota?.length || 0;
    const laki     = anggota?.filter(a => a.jenis_kelamin === 'L').length || 0;
    const perempuan= anggota?.filter(a => a.jenis_kelamin === 'P').length || 0;
    const hidup    = anggota?.filter(a => a.status_hidup === 'hidup').length || 0;
    const meninggal= anggota?.filter(a => a.status_hidup === 'meninggal').length || 0;

    const { count: totalNikah } = await BANITAMHID.db
      .from('pernikahan_anggota')
      .select('*', { count: 'exact', head: true })
      .eq('status', 'aktif');

    const statsData = [
      { icon: '👨‍👩‍👧‍👦', label: 'Total Anggota',  num: total,    cls: 'green'  },
      { icon: '👨',       label: 'Laki-laki',    num: laki,     cls: 'blue'   },
      { icon: '👩',       label: 'Perempuan',    num: perempuan,cls: 'purple' },
      { icon: '💚',       label: 'Masih Hidup',  num: hidup,    cls: 'teal'   },
      { icon: '🌙',       label: 'Almarhum/ah',  num: meninggal,cls: 'gray'   },
      { icon: '💍',       label: 'Total Nikah',  num: totalNikah||0, cls: 'gold' },
      { icon: '📊',       label: 'Generasi',     num: '—',      cls: 'orange' },
    ];

    document.getElementById('statsGrid').innerHTML = statsData.map(s => `
      <div class="stat-card">
        <div class="stat-icon ${s.cls}">${s.icon}</div>
        <div class="stat-num">${s.num}</div>
        <div class="stat-label">${s.label}</div>
      </div>`).join('');

  } catch (err) {
    console.error('loadStats error:', err);
  }
}

// ── LOAD NOTIFIKASI ──
async function loadNotifikasi() {
  try {
    const data = await BANITAMHID.Notifikasi.getAll(8);
    const container = document.getElementById('notifList');
    if (!data?.length) {
      container.innerHTML = `<div class="empty-state" style="padding:32px">
        <div class="empty-icon">🔔</div>
        <h3>Belum ada notifikasi</h3>
      </div>`;
      return;
    }

    const tipeIcon = { tambah: '➕', kematian: '🌙', pernikahan: '💍', kelahiran: '👶', edit: '✏️' };

    container.innerHTML = data.map(n => `
      <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;${!n.dibaca ? 'background:#fafdf8' : ''}">
        <span style="font-size:20px;flex-shrink:0">${tipeIcon[n.tipe] || '📢'}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:${n.dibaca ? '400' : '600'};color:var(--text-dark);margin-bottom:2px">${n.judul}</div>
          <div style="font-size:12px;color:var(--text-light);line-height:1.5">${n.pesan}</div>
          <div style="font-size:11px;color:var(--text-light);margin-top:4px">${UI.formatDate(n.created_at)}</div>
        </div>
        ${!n.dibaca ? `<div style="width:8px;height:8px;border-radius:50%;background:var(--green-light);flex-shrink:0;margin-top:4px"></div>` : ''}
      </div>`).join('');
  } catch (err) {
    console.error('loadNotifikasi error:', err);
  }
}

// ── LOAD ANGGOTA TERBARU ──
async function loadAnggotaTerbaru() {
  try {
    const { data } = await BANITAMHID.db
      .from('anggota_keluarga')
      .select('id, nama_lengkap, jenis_kelamin, tempat_lahir, tanggal_lahir, status_hidup, foto_profil_url, created_at')
      .order('created_at', { ascending: false })
      .limit(8);

    const tbody = document.getElementById('tbodyTerbaru');
    if (!data?.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty-state" style="padding:40px">Belum ada data anggota.</td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(a => `
      <tr style="cursor:pointer" onclick="window.location.href='anggota.html?id=${a.id}'">
        <td>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="avatar" style="background:${a.jenis_kelamin==='L'?'#e8f0fe':'#f3e8fd'};color:${a.jenis_kelamin==='L'?'#1a56b0':'#7b2fbe'}">
              ${a.foto_profil_url ? `<img src="${a.foto_profil_url}" alt="">` : UI.inisial(a.nama_lengkap)}
            </div>
            <div>
              <div style="font-weight:500">${a.nama_lengkap}</div>
            </div>
          </div>
        </td>
        <td>
          <span class="badge ${a.jenis_kelamin==='L'?'badge-blue':'badge-purple'}">
            ${a.jenis_kelamin==='L'?'Laki-laki':'Perempuan'}
          </span>
        </td>
        <td style="color:var(--text-mid)">
          ${[a.tempat_lahir, a.tanggal_lahir ? UI.formatDate(a.tanggal_lahir) : null].filter(Boolean).join(', ') || '—'}
        </td>
        <td>
          <span class="badge ${a.status_hidup==='hidup'?'badge-green':'badge-gray'}">
            ${a.status_hidup==='hidup'?'Hidup':'Almarhum/ah'}
          </span>
        </td>
        <td style="color:var(--text-light);font-size:12.5px">${UI.formatDate(a.created_at)}</td>
      </tr>`).join('');
  } catch (err) {
    console.error('loadAnggotaTerbaru error:', err);
  }
}

// ── LOAD CHART PERTUMBUHAN ──
async function loadChart() {
  try {
    const { data } = await BANITAMHID.db
      .from('anggota_keluarga')
      .select('tanggal_lahir')
      .not('tanggal_lahir', 'is', null)
      .order('tanggal_lahir');

    // Group per dekade/tahun
    const grouped = {};
    data?.forEach(a => {
      const tahun = new Date(a.tanggal_lahir).getFullYear();
      grouped[tahun] = (grouped[tahun] || 0) + 1;
    });

    const labels  = Object.keys(grouped).sort();
    const values  = labels.map(l => grouped[l]);

    // Kumulatif
    const kumulatif = [];
    values.reduce((acc, v, i) => { kumulatif[i] = acc + v; return kumulatif[i]; }, 0);

    const ctx = document.getElementById('chartPertumbuhan');
    if (!ctx) return;

    if (window._chart) window._chart.destroy();
    window._chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: 'Lahir per Tahun',
            data: values,
            backgroundColor: 'rgba(45,138,99,.25)',
            borderColor: 'rgba(45,138,99,.8)',
            borderWidth: 2,
            borderRadius: 4,
            order: 2
          },
          {
            label: 'Total Kumulatif',
            data: kumulatif,
            type: 'line',
            borderColor: 'rgba(201,168,76,1)',
            backgroundColor: 'rgba(201,168,76,.1)',
            borderWidth: 2.5,
            pointRadius: 3,
            fill: true,
            tension: .4,
            order: 1
          }
        ]
      },
      options: {
        responsive: true,
        interaction: { intersect: false, mode: 'index' },
        plugins: { legend: { position: 'top', labels: { font: { family: 'Plus Jakarta Sans', size: 12 } } } },
        scales: {
          x: { grid: { display: false }, ticks: { maxTicksLimit: 12, font: { size: 11 } } },
          y: { grid: { color: 'rgba(0,0,0,.05)' }, ticks: { font: { size: 11 } } }
        }
      }
    });
  } catch (err) {
    console.error('loadChart error:', err);
    const ctx = document.getElementById('chartPertumbuhan');
    if (ctx) ctx.parentElement.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-light);font-size:13px">Belum ada data untuk ditampilkan.</div>`;
  }
}
</script>
</body>
</html>
