<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Laporan — BAFITS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    .report-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }
    .report-card {
      background: #fff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: box-shadow .2s;
    }
    .report-card:hover { box-shadow: var(--shadow-md); }
    .report-card-icon { font-size: 32px; }
    .report-card h3 { font-size: 15px; font-weight: 600; color: var(--green-dark); }
    .report-card p  { font-size: 12.5px; color: var(--text-light); line-height: 1.6; }
    .report-card-actions { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }

    /* Print CSS */
    @media print {
      .sidebar, .topbar, .topbar-actions, .btn, .no-print { display: none !important; }
      .main-wrap { margin-left: 0 !important; }
      .print-area { display: block !important; }
      body { background: #fff; }
      table { font-size: 11px; }
      thead th { background: #1a5c42 !important; color: #fff !important; -webkit-print-color-adjust: exact; }
    }

    .print-area { display: none; }

    /* Preview tabel */
    .preview-card {
      margin-top: 24px;
    }
    .preview-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
    }
    .filter-row {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      padding: 16px; background: var(--cream); border-radius: 10px;
      border: 1px solid var(--border); margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f0ea">
  <div style="text-align:center;color:#8a8a8a"><div style="font-size:32px">🌳</div><div>Memuat...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/ui.js"></script>
<script>
let reportData = [];
let activeReport = '';

(async () => {
  const session = await BAFITS.Auth.requireAuth();
  if (!session) return;
  const user    = await BAFITS.Auth.getUser();
  const profile = await BAFITS.UserProfile.getProfile(user.id);

  document.getElementById('root').outerHTML = `
  <div class="app-shell">
    ${UI._sidebar('laporan', profile)}
    <div class="main-wrap">
      ${UI._topbar('Laporan', profile)}
      <div class="page-content">

        <div style="margin-bottom:24px">
          <h2 style="font-family:'Amiri',serif;font-size:22px;color:var(--green-dark);margin-bottom:4px">Cetak & Export Laporan</h2>
          <p style="font-size:13px;color:var(--text-light)">Pilih jenis laporan, atur filter, lalu cetak atau export ke Excel.</p>
        </div>

        <!-- Kartu jenis laporan -->
        <div class="report-cards">
          ${reportCard('anggota', '👨‍👩‍👧‍👦', 'Data Anggota Keluarga', 'Daftar lengkap seluruh anggota keluarga Bani Tamhid beserta data pribadi.')}
          ${reportCard('pernikahan', '💍', 'Daftar Pernikahan', 'Riwayat pernikahan seluruh anggota keluarga.')}
          ${reportCard('kelahiran', '👶', 'Daftar Kelahiran', 'Statistik kelahiran berdasarkan tahun dan data anggota.')}
          ${reportCard('kematian', '🌙', 'Daftar Kematian', 'Data anggota keluarga yang telah berpulang.')}
          ${reportCard('statistik', '📊', 'Ringkasan Statistik', 'Rangkuman statistik keluarga: total anggota, generasi, dsb.')}
        </div>

        <!-- Area Preview -->
        <div id="previewArea"></div>

      </div>
    </div>
  </div>
  <div class="sidebar-overlay" onclick="UI.closeSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>
  `;

  UI._bindEvents(profile);
})();

function reportCard(type, icon, title, desc) {
  return `
  <div class="report-card">
    <div class="report-card-icon">${icon}</div>
    <h3>${title}</h3>
    <p>${desc}</p>
    <div class="report-card-actions">
      <button class="btn btn-primary btn-sm" onclick="loadReport('${type}')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14" height="14"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Preview
      </button>
      <button class="btn btn-secondary btn-sm" onclick="exportExcel('${type}')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Excel
      </button>
    </div>
  </div>`;
}

// ── LOAD REPORT ──
async function loadReport(type) {
  activeReport = type;
  const area = document.getElementById('previewArea');
  area.innerHTML = `<div class="card preview-card"><div class="card-body" style="text-align:center;padding:40px;color:var(--text-light)">Memuat data laporan...</div></div>`;

  try {
    switch(type) {
      case 'anggota':    await reportAnggota(area);    break;
      case 'pernikahan': await reportPernikahan(area); break;
      case 'kelahiran':  await reportKelahiran(area);  break;
      case 'kematian':   await reportKematian(area);   break;
      case 'statistik':  await reportStatistik(area);  break;
    }
  } catch (err) {
    area.innerHTML = `<div class="alert alert-error">Gagal memuat laporan: ${err.message}</div>`;
  }
}

// ── LAPORAN ANGGOTA ──
async function reportAnggota(area) {
  const { data, error } = await BAFITS.db
    .from('anggota_keluarga')
    .select('nama_lengkap, jenis_kelamin, tempat_lahir, tanggal_lahir, nama_ayah, nama_ibu, status_hidup, status_pernikahan, alamat, nomor_hp')
    .order('nama_lengkap');
  if (error) throw error;
  reportData = data;

  area.innerHTML = `
  <div class="card preview-card">
    <div class="card-header">
      <span>👨‍👩‍👧‍👦</span>
      <h2>Data Anggota Keluarga (${data.length} orang)</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-gold btn-sm" onclick="cetakLaporan()">🖨️ Cetak</button>
        <button class="btn btn-secondary btn-sm" onclick="exportExcel('anggota')">📊 Excel</button>
      </div>
    </div>

    <div class="filter-row no-print">
      <select class="form-control" style="width:auto;padding:8px 12px;font-size:13px" onchange="filterTableAnggota('jk',this.value)">
        <option value="">Semua JK</option><option value="L">Laki-laki</option><option value="P">Perempuan</option>
      </select>
      <select class="form-control" style="width:auto;padding:8px 12px;font-size:13px" onchange="filterTableAnggota('status',this.value)">
        <option value="">Semua Status</option><option value="hidup">Hidup</option><option value="meninggal">Meninggal</option>
      </select>
      <div class="search-wrap" style="max-width:220px">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" placeholder="Cari nama..." oninput="filterTableAnggota('search',this.value)"/>
      </div>
    </div>

    <div class="table-wrap">
      <table id="tableAnggota">
        <thead>
          <tr>
            <th>No</th><th>Nama Lengkap</th><th>JK</th><th>Tempat, Tgl Lahir</th>
            <th>Orang Tua</th><th>Status</th><th>Alamat</th><th>No HP</th>
          </tr>
        </thead>
        <tbody id="tbodyAnggotaReport">
          ${renderRowsAnggota(data)}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderRowsAnggota(data) {
  if (!data.length) return `<tr><td colspan="8" class="empty-state">Tidak ada data</td></tr>`;
  const statusNikah = { belum_menikah:'Belum Nikah', menikah:'Menikah', cerai:'Cerai', duda_janda:'Duda/Janda' };
  return data.map((a, i) => `
    <tr>
      <td style="color:var(--text-light)">${i+1}</td>
      <td style="font-weight:500">${a.nama_lengkap}</td>
      <td><span class="badge ${a.jenis_kelamin==='L'?'badge-blue':'badge-purple'}">${a.jenis_kelamin==='L'?'L':'P'}</span></td>
      <td style="font-size:12.5px">${[a.tempat_lahir, a.tanggal_lahir?UI.formatDate(a.tanggal_lahir):null].filter(Boolean).join(', ')||'—'}</td>
      <td style="font-size:12.5px;color:var(--text-mid)">${[a.nama_ayah?'👨 '+a.nama_ayah:null, a.nama_ibu?'👩 '+a.nama_ibu:null].filter(Boolean).join('<br>')||'—'}</td>
      <td><span class="badge ${a.status_hidup==='hidup'?'badge-green':'badge-gray'}">${a.status_hidup==='hidup'?'Hidup':'Almarhum'}</span></td>
      <td style="font-size:12px;color:var(--text-mid);max-width:160px">${a.alamat||'—'}</td>
      <td style="font-size:12.5px">${a.nomor_hp||'—'}</td>
    </tr>`).join('');
}

let filterJKVal = '', filterStatusVal = '', filterSearchVal = '';
function filterTableAnggota(type, val) {
  if (type==='jk')     filterJKVal     = val;
  if (type==='status') filterStatusVal = val;
  if (type==='search') filterSearchVal = val.toLowerCase();
  const filtered = reportData.filter(a =>
    (!filterJKVal     || a.jenis_kelamin === filterJKVal) &&
    (!filterStatusVal || a.status_hidup  === filterStatusVal) &&
    (!filterSearchVal || a.nama_lengkap.toLowerCase().includes(filterSearchVal))
  );
  document.getElementById('tbodyAnggotaReport').innerHTML = renderRowsAnggota(filtered);
}

// ── LAPORAN PERNIKAHAN ──
async function reportPernikahan(area) {
  const { data, error } = await BAFITS.db
    .from('pernikahan_anggota')
    .select(`*, anggota:anggota_keluarga(nama_lengkap, jenis_kelamin)`)
    .order('tanggal_menikah', { ascending: false });
  if (error) throw error;
  reportData = data;

  area.innerHTML = `
  <div class="card preview-card">
    <div class="card-header">
      <span>💍</span><h2>Daftar Pernikahan (${data.length} data)</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-gold btn-sm" onclick="cetakLaporan()">🖨️ Cetak</button>
        <button class="btn btn-secondary btn-sm" onclick="exportExcel('pernikahan')">📊 Excel</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>No</th><th>Nama</th><th>Pasangan</th><th>Tgl Menikah</th><th>Status</th><th>Ket</th></tr></thead>
        <tbody>
          ${data.map((p,i) => `<tr>
            <td style="color:var(--text-light)">${i+1}</td>
            <td style="font-weight:500">${p.anggota?.nama_lengkap||'—'}</td>
            <td>${p.nama_pasangan}</td>
            <td>${p.tanggal_menikah?UI.formatDate(p.tanggal_menikah):'—'}</td>
            <td><span class="badge ${p.status==='aktif'?'badge-green':p.status==='cerai'?'badge-red':'badge-gray'}">${{aktif:'Aktif',cerai:'Cerai',meninggal:'Pasangan Meninggal'}[p.status]||p.status}</span></td>
            <td style="font-size:12px;color:var(--text-light)">${p.keterangan||'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ── LAPORAN KELAHIRAN ──
async function reportKelahiran(area) {
  const { data, error } = await BAFITS.db
    .from('anggota_keluarga')
    .select('nama_lengkap, jenis_kelamin, tempat_lahir, tanggal_lahir, nama_ayah, nama_ibu')
    .not('tanggal_lahir', 'is', null)
    .order('tanggal_lahir', { ascending: false });
  if (error) throw error;
  reportData = data;

  // Kelompok per tahun
  const byYear = {};
  data.forEach(a => { const y = new Date(a.tanggal_lahir).getFullYear(); byYear[y] = (byYear[y]||0)+1; });
  const topYears = Object.entries(byYear).sort((a,b)=>b[1]-a[1]).slice(0,5);

  area.innerHTML = `
  <div class="card preview-card">
    <div class="card-header">
      <span>👶</span><h2>Daftar Kelahiran (${data.length} data)</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-gold btn-sm" onclick="cetakLaporan()">🖨️ Cetak</button>
        <button class="btn btn-secondary btn-sm" onclick="exportExcel('kelahiran')">📊 Excel</button>
      </div>
    </div>
    <div class="card-body" style="padding-bottom:0">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
        ${topYears.map(([y,c]) => `<div style="padding:8px 14px;background:var(--green-pale);border-radius:8px;font-size:12.5px;color:var(--green-mid)"><strong>${y}</strong>: ${c} orang</div>`).join('')}
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>No</th><th>Nama</th><th>JK</th><th>Tempat Lahir</th><th>Tanggal Lahir</th><th>Orang Tua</th></tr></thead>
        <tbody>
          ${data.map((a,i) => `<tr>
            <td style="color:var(--text-light)">${i+1}</td>
            <td style="font-weight:500">${a.nama_lengkap}</td>
            <td><span class="badge ${a.jenis_kelamin==='L'?'badge-blue':'badge-purple'}">${a.jenis_kelamin==='L'?'L':'P'}</span></td>
            <td>${a.tempat_lahir||'—'}</td>
            <td>${UI.formatDate(a.tanggal_lahir)}</td>
            <td style="font-size:12px;color:var(--text-mid)">${[a.nama_ayah,a.nama_ibu].filter(Boolean).join(' & ')||'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ── LAPORAN KEMATIAN ──
async function reportKematian(area) {
  const { data, error } = await BAFITS.db
    .from('anggota_keluarga')
    .select('nama_lengkap, jenis_kelamin, tanggal_lahir, tanggal_wafat, lokasi_makam, keterangan_wafat')
    .eq('status_hidup', 'meninggal')
    .order('tanggal_wafat', { ascending: false });
  if (error) throw error;
  reportData = data;

  area.innerHTML = `
  <div class="card preview-card">
    <div class="card-header">
      <span>🌙</span><h2>Daftar Kematian (${data.length} almarhum/ah)</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-gold btn-sm" onclick="cetakLaporan()">🖨️ Cetak</button>
        <button class="btn btn-secondary btn-sm" onclick="exportExcel('kematian')">📊 Excel</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>No</th><th>Nama</th><th>JK</th><th>Tanggal Lahir</th><th>Tanggal Wafat</th><th>Usia</th><th>Lokasi Makam</th><th>Keterangan</th></tr></thead>
        <tbody>
          ${data.map((a,i) => `<tr>
            <td style="color:var(--text-light)">${i+1}</td>
            <td style="font-weight:500">${a.nama_lengkap}</td>
            <td><span class="badge ${a.jenis_kelamin==='L'?'badge-blue':'badge-purple'}">${a.jenis_kelamin==='L'?'L':'P'}</span></td>
            <td>${a.tanggal_lahir?UI.formatDate(a.tanggal_lahir):'—'}</td>
            <td>${a.tanggal_wafat?UI.formatDate(a.tanggal_wafat):'—'}</td>
            <td>${UI.formatAge(a.tanggal_lahir, a.tanggal_wafat)}</td>
            <td style="font-size:12px">${a.lokasi_makam||'—'}</td>
            <td style="font-size:12px;color:var(--text-light)">${a.keterangan_wafat||'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ── STATISTIK ──
async function reportStatistik(area) {
  const { data } = await BAFITS.db.from('anggota_keluarga').select('jenis_kelamin, status_hidup, status_pernikahan, tanggal_lahir');
  const { count: totalNikah } = await BAFITS.db.from('pernikahan_anggota').select('*',{count:'exact',head:true}).eq('status','aktif');

  const total  = data?.length || 0;
  const laki   = data?.filter(a=>a.jenis_kelamin==='L').length || 0;
  const pr     = data?.filter(a=>a.jenis_kelamin==='P').length || 0;
  const hidup  = data?.filter(a=>a.status_hidup==='hidup').length || 0;
  const wafat  = data?.filter(a=>a.status_hidup==='meninggal').length || 0;
  const menikah= data?.filter(a=>a.status_pernikahan==='menikah').length || 0;

  area.innerHTML = `
  <div class="card preview-card">
    <div class="card-header">
      <span>📊</span><h2>Ringkasan Statistik Keluarga</h2>
      <button class="btn btn-gold btn-sm" onclick="cetakLaporan()">🖨️ Cetak</button>
    </div>
    <div class="card-body">
      <div style="font-family:'Amiri',serif;font-size:22px;color:var(--green-dark);text-align:center;margin-bottom:24px">
        Silsilah Keluarga Besar Bani Tamhid
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px">
        ${statBox('👨‍👩‍👧‍👦', 'Total Anggota', total, 'green')}
        ${statBox('👨', 'Laki-laki', laki + ` (${total?Math.round(laki/total*100):0}%)`, 'blue')}
        ${statBox('👩', 'Perempuan', pr + ` (${total?Math.round(pr/total*100):0}%)`, 'purple')}
        ${statBox('💚', 'Masih Hidup', hidup, 'teal')}
        ${statBox('🌙', 'Almarhum/ah', wafat, 'gray')}
        ${statBox('💍', 'Pasangan Aktif', totalNikah||0, 'gold')}
        ${statBox('💑', 'Sudah Menikah', menikah, 'green')}
      </div>
      <div style="margin-top:24px;padding:16px;background:var(--cream);border-radius:10px;font-size:12.5px;color:var(--text-mid);line-height:2">
        Dicetak pada: <strong>${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</strong><br>
        Sistem: <strong>BAFITS — Bani Tamhid Family Tree System</strong>
      </div>
    </div>
  </div>`;
}

function statBox(icon, label, val, cls) {
  const colors = { green:'var(--green-pale)', blue:'#e8f0fe', purple:'#f3e8fd', teal:'#e0f7f4', gray:'#f0ece6', gold:'#fff8e1' };
  return `<div style="padding:20px;border-radius:10px;background:${colors[cls]||'var(--cream)'};text-align:center">
    <div style="font-size:28px;margin-bottom:8px">${icon}</div>
    <div style="font-size:24px;font-family:'Amiri',serif;font-weight:700;color:var(--green-dark)">${val}</div>
    <div style="font-size:12px;color:var(--text-light)">${label}</div>
  </div>`;
}

// ── CETAK ──
function cetakLaporan() {
  window.print();
}

// ── EXPORT EXCEL ──
async function exportExcel(type) {
  BAFITS.Toast.info('Menyiapkan file Excel...');
  try {
    let sheetData = [];
    let fileName  = 'laporan';

    if (type === 'anggota') {
      const { data } = await BAFITS.db.from('anggota_keluarga').select('*').order('nama_lengkap');
      sheetData = (data||[]).map((a,i) => ({
        'No': i+1, 'Nama Lengkap': a.nama_lengkap,
        'Jenis Kelamin': a.jenis_kelamin==='L'?'Laki-laki':'Perempuan',
        'Tempat Lahir': a.tempat_lahir||'', 'Tanggal Lahir': a.tanggal_lahir||'',
        'Nama Ayah': a.nama_ayah||'', 'Nama Ibu': a.nama_ibu||'',
        'Status Hidup': a.status_hidup, 'Tanggal Wafat': a.tanggal_wafat||'',
        'Lokasi Makam': a.lokasi_makam||'', 'Status Pernikahan': a.status_pernikahan||'',
        'Alamat': a.alamat||'', 'No HP': a.nomor_hp||'', 'Email': a.email||''
      }));
      fileName = 'laporan-anggota-keluarga';
    } else if (type === 'pernikahan') {
      const { data } = await BAFITS.db.from('pernikahan_anggota').select('*, anggota:anggota_keluarga(nama_lengkap)').order('tanggal_menikah', {ascending:false});
      sheetData = (data||[]).map((p,i) => ({
        'No': i+1, 'Nama': p.anggota?.nama_lengkap||'',
        'Pasangan ke-': p.urutan, 'Nama Pasangan': p.nama_pasangan,
        'Tgl Menikah': p.tanggal_menikah||'', 'Tgl Berakhir': p.tanggal_berakhir||'',
        'Status': p.status, 'Keterangan': p.keterangan||''
      }));
      fileName = 'laporan-pernikahan';
    } else if (type === 'kelahiran') {
      const { data } = await BAFITS.db.from('anggota_keluarga').select('nama_lengkap, jenis_kelamin, tempat_lahir, tanggal_lahir, nama_ayah, nama_ibu').not('tanggal_lahir','is',null).order('tanggal_lahir',{ascending:false});
      sheetData = (data||[]).map((a,i) => ({
        'No': i+1, 'Nama': a.nama_lengkap,
        'JK': a.jenis_kelamin==='L'?'Laki-laki':'Perempuan',
        'Tempat Lahir': a.tempat_lahir||'', 'Tanggal Lahir': a.tanggal_lahir||'',
        'Ayah': a.nama_ayah||'', 'Ibu': a.nama_ibu||''
      }));
      fileName = 'laporan-kelahiran';
    } else if (type === 'kematian') {
      const { data } = await BAFITS.db.from('anggota_keluarga').select('nama_lengkap, jenis_kelamin, tanggal_lahir, tanggal_wafat, lokasi_makam, keterangan_wafat').eq('status_hidup','meninggal').order('tanggal_wafat',{ascending:false});
      sheetData = (data||[]).map((a,i) => ({
        'No': i+1, 'Nama': a.nama_lengkap,
        'JK': a.jenis_kelamin==='L'?'Laki-laki':'Perempuan',
        'Tgl Lahir': a.tanggal_lahir||'', 'Tgl Wafat': a.tanggal_wafat||'',
        'Lokasi Makam': a.lokasi_makam||'', 'Keterangan': a.keterangan_wafat||''
      }));
      fileName = 'laporan-kematian';
    }

    const ws = XLSX.utils.json_to_sheet(sheetData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Laporan');

    // Styling header (lebar kolom)
    const range = XLSX.utils.decode_range(ws['!ref']);
    ws['!cols'] = Array(range.e.c + 1).fill({ wch: 20 });

    XLSX.writeFile(wb, `${fileName}-${new Date().toISOString().slice(0,10)}.xlsx`);
    BAFITS.Toast.success('File Excel berhasil diunduh!');
  } catch (err) {
    BAFITS.Toast.error('Gagal export: ' + err.message);
  }
}
</script>
</body>
</html>
