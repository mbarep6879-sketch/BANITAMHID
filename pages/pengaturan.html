<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pengaturan & Backup — BAFITS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f0ea">
  <div style="text-align:center;color:#8a8a8a"><div style="font-size:32px">🌳</div><div>Memuat...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/ui.js"></script>
<script>
let currentProfile = null;

(async () => {
  const session = await BAFITS.Auth.requireAuth();
  if (!session) return;
  const user    = await BAFITS.Auth.getUser();
  const profile = await BAFITS.UserProfile.getProfile(user.id);
  currentProfile = profile;
  const isSuperAdmin = profile?.role === 'super_admin';

  document.getElementById('root').outerHTML = `
  <div class="app-shell">
    ${UI._sidebar('pengaturan', profile)}
    <div class="main-wrap">
      ${UI._topbar('Pengaturan & Backup', profile)}
      <div class="page-content" style="max-width:900px">

        <!-- Profil Saya -->
        <div class="card" style="margin-bottom:20px">
          <div class="card-header"><span>👤</span><h2>Profil Saya</h2></div>
          <div class="card-body">
            <div style="display:flex;gap:20px;align-items:center;margin-bottom:24px;flex-wrap:wrap">
              <div class="avatar" style="width:64px;height:64px;font-size:24px;border-radius:16px">
                ${(profile?.nama_lengkap||'U')[0].toUpperCase()}
              </div>
              <div>
                <div style="font-size:18px;font-weight:600;color:var(--green-dark)">${profile?.nama_lengkap||'—'}</div>
                <div style="font-size:13px;color:var(--text-light)">${profile?.email||'—'}</div>
                <span class="badge ${profile?.role==='super_admin'?'badge-gold':profile?.role==='admin_keluarga'?'badge-green':'badge-blue'}" style="margin-top:6px">
                  ${{super_admin:'Super Admin',admin_keluarga:'Admin Keluarga',member:'Member'}[profile?.role]||profile?.role}
                </span>
              </div>
            </div>
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="p-nama" value="${profile?.nama_lengkap||''}"/>
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" value="${profile?.email||''}" readonly style="background:#f8f6f2;color:var(--text-light)"/>
                <div class="form-hint">Email tidak dapat diubah</div>
              </div>
            </div>
            <div id="profileAlert" style="margin-top:12px"></div>
            <div style="margin-top:16px">
              <button class="btn btn-primary" onclick="simpanProfil()">
                <span class="btn-text">💾 Simpan Profil</span>
                <div class="spinner"></div>
              </button>
            </div>
          </div>
        </div>

        <!-- Ganti Password -->
        <div class="card" style="margin-bottom:20px">
          <div class="card-header"><span>🔐</span><h2>Ganti Password</h2></div>
          <div class="card-body">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Password Baru</label>
                <input type="password" class="form-control" id="p-pass-baru" placeholder="Minimal 8 karakter"/>
              </div>
              <div class="form-group">
                <label class="form-label">Konfirmasi Password</label>
                <input type="password" class="form-control" id="p-pass-konfirm" placeholder="Ulangi password baru"/>
              </div>
            </div>
            <div id="passAlert" style="margin-top:12px"></div>
            <div style="margin-top:16px">
              <button class="btn btn-secondary" onclick="gantiPassword()">
                <span class="btn-text">🔑 Ganti Password</span>
                <div class="spinner"></div>
              </button>
            </div>
          </div>
        </div>

        <!-- Backup & Export (hanya Super Admin) -->
        ${isSuperAdmin ? `
        <div class="card" style="margin-bottom:20px">
          <div class="card-header"><span>💾</span><h2>Backup & Export Data</h2></div>
          <div class="card-body">
            <div class="alert alert-warning" style="margin-bottom:20px">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              Lakukan backup secara rutin untuk menjaga keamanan data keluarga.
            </div>

            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px">

              ${backupCard('📊', 'Export Semua Data', 'Export seluruh data anggota, pernikahan, kelahiran, kematian ke dalam satu file Excel.', 'exportSemua()')}
              ${backupCard('👨‍👩‍👧‍👦', 'Backup Anggota', 'Export data anggota keluarga ke file Excel dengan semua kolom.', "exportTabel('anggota_keluarga','backup-anggota')")}
              ${backupCard('💍', 'Backup Pernikahan', 'Export seluruh riwayat pernikahan.', "exportTabel('pernikahan_anggota','backup-pernikahan')")}
              ${backupCard('📋', 'Backup Audit Log', 'Export log perubahan data untuk keperluan audit.', "exportTabel('audit_log','backup-audit-log')")}
            </div>

            <div class="divider"></div>

            <div style="font-size:13.5px;font-weight:600;color:var(--green-dark);margin-bottom:12px">📥 Import Data</div>
            <div style="padding:20px;background:var(--cream);border-radius:10px;border:1px dashed var(--border);font-size:13px;color:var(--text-mid)">
              Fitur import data dari Excel sedang dalam pengembangan.<br>
              Untuk saat ini, tambahkan data melalui menu <strong>Anggota Keluarga</strong>.
            </div>

            <div class="divider"></div>

            <div style="font-size:13.5px;font-weight:600;color:var(--green-dark);margin-bottom:12px">☁️ Backup Supabase</div>
            <div style="padding:16px;background:var(--cream);border-radius:10px;border:1px solid var(--border);font-size:13px;color:var(--text-mid)">
              Supabase melakukan backup otomatis setiap hari pada paket Pro.<br>
              Untuk backup manual:
              <ol style="margin:10px 0 0 16px;line-height:2">
                <li>Buka <strong>Supabase Dashboard</strong></li>
                <li>Klik menu <strong>Database → Backups</strong></li>
                <li>Klik <strong>Download latest backup</strong></li>
              </ol>
              <a href="https://supabase.com/dashboard" target="_blank" class="btn btn-secondary btn-sm" style="margin-top:12px;display:inline-flex">
                Buka Supabase Dashboard ↗
              </a>
            </div>
          </div>
        </div>

        <!-- Statistik database -->
        <div class="card" style="margin-bottom:20px">
          <div class="card-header"><span>📈</span><h2>Statistik Database</h2></div>
          <div class="card-body">
            <div id="dbStats" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px">
              <div style="padding:14px;background:var(--cream);border-radius:8px;text-align:center">
                <div class="skeleton" style="height:28px;width:60px;margin:0 auto 6px;border-radius:4px"></div>
                <div class="skeleton" style="height:12px;width:80px;margin:0 auto;border-radius:4px"></div>
              </div>
            </div>
          </div>
        </div>
        ` : ''}

        <!-- Tentang Aplikasi -->
        <div class="card">
          <div class="card-header"><span>ℹ️</span><h2>Tentang BAFITS</h2></div>
          <div class="card-body">
            <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
              <div style="width:64px;height:64px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0">🌳</div>
              <div style="flex:1">
                <div style="font-family:'Amiri',serif;font-size:20px;color:var(--green-dark);margin-bottom:4px">BAFITS</div>
                <div style="font-size:12px;color:var(--text-light);margin-bottom:12px">Bani Tamhid Family Tree System · Versi 1.0</div>
                <div style="font-size:13px;color:var(--text-mid);line-height:2">
                  <div>🔧 Frontend: HTML, CSS, JavaScript</div>
                  <div>☁️ Backend: Supabase (PostgreSQL + Auth + Storage)</div>
                  <div>🚀 Hosting: Vercel</div>
                  <div>📦 Repository: GitHub</div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <div class="sidebar-overlay" onclick="UI.closeSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>
  `;

  UI._bindEvents(profile);
  if (isSuperAdmin) loadDbStats();
})();

function backupCard(icon, title, desc, action) {
  return `
  <div style="padding:20px;background:var(--cream);border-radius:10px;border:1px solid var(--border)">
    <div style="font-size:28px;margin-bottom:10px">${icon}</div>
    <div style="font-size:13.5px;font-weight:600;color:var(--green-dark);margin-bottom:6px">${title}</div>
    <div style="font-size:12px;color:var(--text-mid);line-height:1.6;margin-bottom:14px">${desc}</div>
    <button class="btn btn-secondary btn-sm" onclick="${action}">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download Excel
    </button>
  </div>`;
}

// ── SIMPAN PROFIL ──
async function simpanProfil() {
  const btn   = document.querySelector('[onclick="simpanProfil()"]');
  const alert = document.getElementById('profileAlert');
  const nama  = document.getElementById('p-nama').value.trim();
  if (!nama) { alert.innerHTML = `<div class="alert alert-error">Nama tidak boleh kosong.</div>`; return; }

  UI.setLoading(btn, true);
  try {
    const { error } = await BAFITS.db.from('user_profiles').update({ nama_lengkap: nama }).eq('id', currentProfile.id);
    if (error) throw error;
    alert.innerHTML = `<div class="alert alert-success">✓ Profil berhasil disimpan.</div>`;
    BAFITS.Toast.success('Profil diperbarui!');
    setTimeout(() => alert.innerHTML = '', 3000);
  } catch (err) {
    alert.innerHTML = `<div class="alert alert-error">Gagal: ${err.message}</div>`;
  } finally {
    UI.setLoading(btn, false);
  }
}

// ── GANTI PASSWORD ──
async function gantiPassword() {
  const btn    = document.querySelector('[onclick="gantiPassword()"]');
  const alert  = document.getElementById('passAlert');
  const baru   = document.getElementById('p-pass-baru').value;
  const konfirm= document.getElementById('p-pass-konfirm').value;

  alert.innerHTML = '';
  if (baru.length < 8) { alert.innerHTML = `<div class="alert alert-error">Password minimal 8 karakter.</div>`; return; }
  if (baru !== konfirm) { alert.innerHTML = `<div class="alert alert-error">Password tidak cocok.</div>`; return; }

  UI.setLoading(btn, true);
  try {
    const { error } = await BAFITS.db.auth.updateUser({ password: baru });
    if (error) throw error;
    alert.innerHTML = `<div class="alert alert-success">✓ Password berhasil diubah.</div>`;
    document.getElementById('p-pass-baru').value = '';
    document.getElementById('p-pass-konfirm').value = '';
    BAFITS.Toast.success('Password diperbarui!');
  } catch (err) {
    alert.innerHTML = `<div class="alert alert-error">Gagal: ${err.message}</div>`;
  } finally {
    UI.setLoading(btn, false);
  }
}

// ── DB STATS ──
async function loadDbStats() {
  const tables = [
    { key: 'anggota_keluarga',   label: 'Anggota',    icon: '👨‍👩‍👧‍👦' },
    { key: 'pernikahan_anggota', label: 'Pernikahan', icon: '💍' },
    { key: 'foto_anggota',       label: 'Foto',       icon: '📷' },
    { key: 'notifikasi',         label: 'Notifikasi', icon: '🔔' },
    { key: 'audit_log',          label: 'Audit Log',  icon: '📋' },
    { key: 'user_profiles',      label: 'Pengguna',   icon: '👥' },
  ];

  const counts = await Promise.all(tables.map(async t => {
    const { count } = await BAFITS.db.from(t.key).select('*', { count: 'exact', head: true });
    return { ...t, count: count || 0 };
  }));

  document.getElementById('dbStats').innerHTML = counts.map(t => `
    <div style="padding:14px;background:var(--cream);border-radius:8px;text-align:center">
      <div style="font-size:22px;margin-bottom:4px">${t.icon}</div>
      <div style="font-size:22px;font-family:'Amiri',serif;font-weight:700;color:var(--green-dark)">${t.count.toLocaleString('id')}</div>
      <div style="font-size:11.5px;color:var(--text-light)">${t.label}</div>
    </div>`).join('');
}

// ── EXPORT EXCEL ──
async function exportTabel(tabel, namaFile) {
  BAFITS.Toast.info('Menyiapkan file backup...');
  try {
    const { data, error } = await BAFITS.db.from(tabel).select('*').order('created_at', { ascending: true });
    if (error) throw error;
    const ws = XLSX.utils.json_to_sheet(data || []);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, tabel);
    XLSX.writeFile(wb, `${namaFile}-${new Date().toISOString().slice(0,10)}.xlsx`);
    BAFITS.Toast.success('Backup berhasil diunduh!');
  } catch (err) {
    BAFITS.Toast.error('Gagal export: ' + err.message);
  }
}

async function exportSemua() {
  BAFITS.Toast.info('Menyiapkan backup lengkap...');
  try {
    const tables = ['anggota_keluarga', 'pernikahan_anggota', 'foto_anggota', 'notifikasi', 'audit_log', 'user_profiles'];
    const wb = XLSX.utils.book_new();
    for (const t of tables) {
      const { data } = await BAFITS.db.from(t).select('*').order('created_at', { ascending: true });
      const ws = XLSX.utils.json_to_sheet(data || []);
      XLSX.utils.book_append_sheet(wb, ws, t.replace('_', '-').slice(0, 31));
    }
    XLSX.writeFile(wb, `bafits-backup-lengkap-${new Date().toISOString().slice(0,10)}.xlsx`);
    BAFITS.Toast.success('Backup lengkap berhasil diunduh!');
  } catch (err) {
    BAFITS.Toast.error('Gagal: ' + err.message);
  }
}
</script>
</body>
</html>
