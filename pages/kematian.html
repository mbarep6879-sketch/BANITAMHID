<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kematian — BAFITS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body>
<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f0ea">
  <div style="text-align:center;color:#8a8a8a"><div style="font-size:32px">🌳</div><div>Memuat...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/ui.js"></script>
<script>
let currentPage  = 1;
const perPage    = 20;
let totalRows    = 0;
let filterSearch = '';
let filterJK     = '';

(async () => {
  const session = await BAFITS.Auth.requireAuth();
  if (!session) return;
  const user    = await BAFITS.Auth.getUser();
  const profile = await BAFITS.UserProfile.getProfile(user.id);

  document.getElementById('root').outerHTML = `
  <div class="app-shell">
    ${UI._sidebar('kematian', profile)}
    <div class="main-wrap">
      ${UI._topbar('Data Kematian', profile)}
      <div class="page-content">

        <!-- Ayat -->
        <div style="background:linear-gradient(135deg,var(--green-dark),var(--green-mid));border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:22px;color:#fff">
          <div style="font-family:'Amiri',serif;font-size:22px;text-align:center;margin-bottom:6px;color:var(--gold-light)">
            إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ
          </div>
          <div style="font-size:12px;text-align:center;color:rgba(255,255,255,.6)">
            "Sesungguhnya kami milik Allah dan kepada-Nya kami kembali." (QS. Al-Baqarah: 156)
          </div>
        </div>

        <!-- Stat -->
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:22px">
          <div class="stat-card"><div class="stat-icon gray">🌙</div><div class="stat-num" id="s-total">—</div><div class="stat-label">Total Almarhum/ah</div></div>
          <div class="stat-card"><div class="stat-icon blue">👨</div><div class="stat-num" id="s-laki">—</div><div class="stat-label">Laki-laki</div></div>
          <div class="stat-card"><div class="stat-icon purple">👩</div><div class="stat-num" id="s-pr">—</div><div class="stat-label">Perempuan</div></div>
          <div class="stat-card"><div class="stat-icon green">📅</div><div class="stat-num" id="s-usia">—</div><div class="stat-label">Rata-rata Usia</div></div>
        </div>

        <!-- Toolbar + Tabel -->
        <div class="card">
          <div class="card-header">
            <span>🌙</span><h2>Daftar Almarhum / Almarhumah</h2>
            <span id="totalLabel" style="font-size:12.5px;color:var(--text-light)">—</span>
          </div>
          <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap">
            <div class="search-wrap" style="max-width:260px">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="search-input" placeholder="Cari nama atau lokasi makam..." oninput="onSearch(this.value)"/>
            </div>
            <select class="form-control" style="width:auto;padding:8px 12px" onchange="filterJK=this.value;currentPage=1;loadData()">
              <option value="">Semua JK</option>
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Nama</th>
                  <th>JK</th>
                  <th>Tgl Lahir</th>
                  <th>Tgl Wafat</th>
                  <th>Usia</th>
                  <th>Lokasi Makam</th>
                  <th>Keterangan</th>
                </tr>
              </thead>
              <tbody id="tbodyKematian">${UI.skeletonRows(7, 8)}</tbody>
            </table>
          </div>
          <div class="pagination" id="paginasi"></div>
        </div>

        <!-- Makam map placeholder -->
        <div class="card" style="margin-top:20px">
          <div class="card-header"><span>📍</span><h2>Persebaran Lokasi Makam</h2></div>
          <div class="card-body" id="makamList">
            <div style="color:var(--text-light);font-size:13px">Memuat data makam...</div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <div class="sidebar-overlay" onclick="UI.closeSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>
  `;

  UI._bindEvents(profile);
  await Promise.all([loadStats(), loadData(), loadMakam()]);
})();

async function loadStats() {
  const { data } = await BAFITS.db
    .from('anggota_keluarga')
    .select('jenis_kelamin, tanggal_lahir, tanggal_wafat')
    .eq('status_hidup', 'meninggal');

  const total = data?.length || 0;
  const laki  = data?.filter(a => a.jenis_kelamin === 'L').length || 0;
  const pr    = data?.filter(a => a.jenis_kelamin === 'P').length || 0;

  // Rata-rata usia
  const usias = data?.filter(a => a.tanggal_lahir && a.tanggal_wafat)
    .map(a => Math.floor((new Date(a.tanggal_wafat) - new Date(a.tanggal_lahir)) / (365.25 * 24 * 3600 * 1000)));
  const rataUsia = usias?.length ? Math.round(usias.reduce((a,b)=>a+b,0)/usias.length) : null;

  document.getElementById('s-total').textContent = total;
  document.getElementById('s-laki').textContent  = laki;
  document.getElementById('s-pr').textContent    = pr;
  document.getElementById('s-usia').textContent  = rataUsia ? rataUsia + ' th' : '—';
}

let searchTimer;
function onSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { filterSearch = val; currentPage = 1; loadData(); }, 400);
}

async function loadData() {
  const tbody = document.getElementById('tbodyKematian');
  tbody.innerHTML = UI.skeletonRows(7, 8);
  try {
    let query = BAFITS.db
      .from('anggota_keluarga')
      .select('id, nama_lengkap, jenis_kelamin, tanggal_lahir, tanggal_wafat, lokasi_makam, keterangan_wafat, foto_profil_url', { count: 'exact' })
      .eq('status_hidup', 'meninggal')
      .order('tanggal_wafat', { ascending: false })
      .range((currentPage-1)*perPage, currentPage*perPage-1);

    if (filterSearch) query = query.or(`nama_lengkap.ilike.%${filterSearch}%,lokasi_makam.ilike.%${filterSearch}%`);
    if (filterJK)     query = query.eq('jenis_kelamin', filterJK);

    const { data, count, error } = await query;
    if (error) throw error;
    totalRows = count || 0;
    document.getElementById('totalLabel').textContent = `${totalRows} data`;

    if (!data?.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">🌙</div><h3>Tidak ada data kematian</h3></div></td></tr>`;
      renderPaginasi(); return;
    }

    tbody.innerHTML = data.map(a => `
      <tr style="cursor:pointer" onclick="window.location.href='anggota.html?id=${a.id}'">
        <td>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="avatar" style="background:#f0ece6;color:#6b7280;filter:grayscale(0.3)">
              ${a.foto_profil_url?`<img src="${a.foto_profil_url}" alt="" style="filter:grayscale(0.4)"/>`:'🌙'}
            </div>
            <span style="font-weight:500">${a.nama_lengkap}</span>
          </div>
        </td>
        <td><span class="badge ${a.jenis_kelamin==='L'?'badge-blue':'badge-purple'}">${a.jenis_kelamin==='L'?'Alm.':'Almh.'}</span></td>
        <td style="font-size:12.5px;color:var(--text-mid)">${a.tanggal_lahir ? UI.formatDate(a.tanggal_lahir) : '—'}</td>
        <td style="font-size:12.5px;white-space:nowrap">${a.tanggal_wafat ? UI.formatDate(a.tanggal_wafat) : '—'}</td>
        <td style="font-size:12.5px;color:var(--text-mid)">${UI.formatAge(a.tanggal_lahir, a.tanggal_wafat)}</td>
        <td style="font-size:12.5px">
          ${a.lokasi_makam ? `<span style="display:flex;align-items:center;gap:4px"><span>📍</span>${a.lokasi_makam}</span>` : '—'}
        </td>
        <td style="font-size:12px;color:var(--text-light);max-width:160px">${a.keterangan_wafat||'—'}</td>
      </tr>`).join('');
    renderPaginasi();
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="alert alert-error" style="margin:16px">Gagal: ${err.message}</div></td></tr>`;
  }
}

function renderPaginasi() {
  const totalPages = Math.ceil(totalRows/perPage);
  const el = document.getElementById('paginasi');
  if (totalPages <= 1) { el.innerHTML=''; return; }
  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage<=1?'disabled':''}>‹</button>`;
  for (let i=1; i<=totalPages; i++) {
    if (i===1||i===totalPages||Math.abs(i-currentPage)<=1)
      html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    else if (Math.abs(i-currentPage)===2) html+=`<span style="padding:0 4px;color:var(--text-light)">…</span>`;
  }
  html+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages?'disabled':''}>›</button>`;
  el.innerHTML = html;
}
function goPage(p) { if(p<1||p>Math.ceil(totalRows/perPage))return; currentPage=p; loadData(); window.scrollTo({top:0}); }

async function loadMakam() {
  const { data } = await BAFITS.db
    .from('anggota_keluarga')
    .select('nama_lengkap, lokasi_makam')
    .eq('status_hidup', 'meninggal')
    .not('lokasi_makam', 'is', null);

  const container = document.getElementById('makamList');
  if (!data?.length) { container.innerHTML = `<div style="color:var(--text-light);font-size:13px">Belum ada data lokasi makam tercatat.</div>`; return; }

  // Kelompokkan per lokasi
  const grouped = {};
  data.forEach(a => { const k = a.lokasi_makam.trim(); if (!grouped[k]) grouped[k]=[];  grouped[k].push(a.nama_lengkap); });

  container.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">
      ${Object.entries(grouped).sort((a,b)=>b[1].length-a[1].length).map(([lok, names]) => `
        <div style="padding:14px 16px;background:var(--cream);border-radius:10px;border:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
            <span style="font-size:18px">📍</span>
            <span style="font-size:13px;font-weight:600;color:var(--green-dark)">${lok}</span>
          </div>
          <div style="font-size:12px;color:var(--text-mid);line-height:1.8">
            ${names.slice(0,3).join(', ')}${names.length>3?` <span style="color:var(--text-light)">+${names.length-3} lainnya</span>`:''}
          </div>
          <div style="font-size:11px;color:var(--text-light);margin-top:6px">${names.length} orang</div>
        </div>`).join('')}
    </div>`;
}
</script>
</body>
</html>
